<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tool — The Family Legacy Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.thead{padding:clamp(40px,5vw,64px) 0 clamp(28px,3.4vw,40px);position:relative;overflow:hidden}
.thead>.wrap{position:relative;z-index:2}
.thead .heroimg{position:absolute;inset:0;background-image:url(img/hero-toolkit.jpg);background-size:cover;background-position:center 32%}
.thead .heroimg::after{content:"";position:absolute;inset:0;background:linear-gradient(168deg,rgba(7,20,14,.95),rgba(11,32,24,.9) 50%,rgba(15,46,35,.8))}
.thead .crumb{font-weight:600;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#A9BCA9}
.thead .crumb a{color:#CFE0CB;text-decoration:none}
.thead h1{color:#fff;font-size:clamp(26px,3.6vw,42px);margin-top:12px}
.thead .tis{color:#D7E1D2;font-size:clamp(14px,1.6vw,16.5px);max-width:60ch;margin-top:12px}
.thead .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.thead .meta span{font-weight:600;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  border:1.5px solid rgba(255,255,255,.26);border-radius:999px;padding:6px 12px;color:#E8F0E2}
.thead .meta span.gold{border-color:#CE9F4F;color:#E3C480}
.tsplit{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(22px,3.4vw,44px);align-items:start}
@media(max-width:980px){.tsplit{grid-template-columns:1fr}}
.tsplit>*{min-width:0}
@media(min-width:981px){.tsplit>div:last-child{position:sticky;top:104px}}
.tin{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh-1);padding:clamp(20px,2.8vw,30px)}
.stepblk{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.stepblk:first-child{margin-top:0;padding-top:0;border-top:0}
.stepblk .sh{display:flex;align-items:baseline;gap:9px;margin-bottom:12px}
.stepblk .sh i{font-style:normal;width:20px;height:20px;border-radius:50%;background:#EEF4E1;color:#57833B;
  font-family:var(--ff-h);font-weight:600;font-size:10px;display:grid;place-items:center;flex:none}
.stepblk .sh b{font-family:var(--ff-h);font-weight:600;font-size:14.5px;color:var(--ink)}
.fld{margin-top:13px}
.fld label{display:block;font-weight:600;font-size:12.3px;color:#33452F;margin-bottom:6px}
.fld input[type=text],.fld textarea{width:100%;border:1.5px solid #DCE3CE;background:#FDFDF8;border-radius:10px;
  padding:11px 13px;font-family:var(--ff-b);font-size:13.3px;color:var(--ink);outline:none;box-sizing:border-box}
.fld textarea{min-height:66px;resize:vertical;line-height:1.6}
.fld input:focus,.fld textarea:focus{border-color:#8FBE3F;background:#fff}
.rowpair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.rowpair{grid-template-columns:1fr}}
.rowtri{display:grid;grid-template-columns:1.2fr 1fr .8fr;gap:10px}
@media(max-width:640px){.rowtri{grid-template-columns:1fr}}
.scaler{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #F0F3EA}
.scaler p{margin:0;font-size:12.8px;color:#3A4A3C;line-height:1.5}
.scaler .sc{display:flex;gap:5px}
.scaler .sc button{width:30px;height:30px;border:1.5px solid #DCE3CE;background:#fff;border-radius:8px;cursor:pointer;
  font-family:var(--ff-b);font-weight:600;font-size:12px;color:#7C877E;transition:all .14s}
.scaler .sc button:hover{border-color:#8FBE3F}
.scaler .sc button.sel{background:linear-gradient(126deg,#2F6B3A,#8FBE3F);border-color:transparent;color:#fff}
.scnote{font-size:11px;font-style:italic;color:var(--mute);margin-bottom:6px}
.addrow{margin-top:10px;display:flex;gap:8px}
.addrow button{border:1.5px dashed #CFDCC0;background:#FBFCF7;border-radius:10px;padding:9px 14px;cursor:pointer;
  font-family:var(--ff-b);font-weight:600;font-size:12px;color:#57833B}
.tacts2{display:flex;gap:12px;align-items:center;margin-top:22px;flex-wrap:wrap}
.svd{font-weight:600;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#3F8F4F;opacity:0;transition:opacity .3s}
.svd.on{opacity:1}
.pcard{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-2);
  padding:clamp(22px,3vw,34px);position:relative;overflow:hidden}
.pcard::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--grad)}
.pcard .tk{font-weight:700;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#8A6A24}
.pcard h3{font-family:var(--ff-h);font-weight:600;font-size:clamp(18px,2.2vw,23px);color:var(--ink);margin:6px 0 2px}
.pcard .pdt{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:14px}
.psec{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.psec b{display:block;font-weight:700;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#3E7C3B;margin-bottom:5px}
.psec p{margin:0 0 6px;font-size:13px;line-height:1.7;color:#33424F}
.psec .em{color:#B9C4AC;font-style:italic}
.pscore{background:#FBFAE8;border:1px solid #EAE7C2;border-radius:12px;padding:14px 16px;margin-top:12px;text-align:center}
.pscore b{font-family:var(--ff-h);font-weight:600;font-size:26px;color:#8A6A24;display:block}
.pscore span{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#A08A4E}
.prod{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;font-style:italic;color:#61705F}
.psig{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.psig span{border-top:1.5px solid #D8E0C8;padding-top:5px;font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.nextnav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:clamp(24px,3vw,34px)}
@media print{
 body.printing *{visibility:hidden}
 body.printing .pcard,body.printing .pcard *{visibility:visible}
 body.printing .pcard{position:absolute;left:0;top:0;width:100%;box-shadow:none;border:0;border-radius:0}
 body.printing .pcard::before{display:none}
}
</style>
</head>
<body>

<header class="dark thead">
  <div class="heroimg"></div>
  <div class="wrap">
    <p class="crumb"><a href="toolkit.html">The Family Legacy Toolkit</a> · <span id="tcoll"></span></p>
    <h1 id="ttitle"></h1>
    <p class="tis" id="tis"></p>
    <div class="meta" id="tmeta"></div>
  </div>
</header>

<section class="sec lightbg">
  <div class="wrap">
    <div class="tsplit">
      <div class="tin" id="form"></div>
      <div>
        <div class="pcard" id="pcard">
          <span class="tk" id="ptk"></span>
          <h3 id="ph"></h3>
          <p class="pdt" id="pdt"></p>
          <div id="pbody"></div>
          <p class="prod" id="pprod"></p>
          <div class="psig"><span>Completed by</span><span>Date</span></div>
        </div>
        <div class="tacts2">
          <button type="button" class="btn grad sm" id="printbtn" style="border:0;cursor:pointer">Print This Tool <span class="ar">→</span></button>
          <span class="svd" id="svd">Saved</span>
        </div>
      </div>
    </div>
    <div class="nextnav">
      <a class="btn linegreen sm" href="toolkit.html#library200">← All Two Hundred Tools</a>
      <a class="btn linegreen sm" id="nextlink" href="#">Next Tool In This Collection →</a>
    </div>
  </div>
</section>

<script src="data.js"></script>
<script src="intel.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
<script>
(function(){
  var name=qs('t')||'Family Discovery Interview';
  var col=null, arc=null, idx=-1, num=0, running=0;
  FDTAX.cols.forEach(function(c){
    c[2].forEach(function(t,i){ running++; if(t===name){col=c; idx=i; num=running;} });
  });
  if(!col){ col=FDTAX.cols[0]; name=col[2][0]; idx=0; num=1; }
  FDTAX.arcs.forEach(function(a){ if(col[0]>=a[1]&&col[0]<=a[2]) arc=a; });
  var spec=FDSPEC[name]||["A working instrument from the Family Legacy library.","A completed record the family keeps."];
  var shape=FDSHAPE[String(col[0])]||["Gather","Decide","Record"];
  var live=FDTAX.live&&FDTAX.live[name];

  document.title=name+' — The Family Legacy Toolkit';
  document.getElementById('tcoll').textContent='Collection '+String(col[0]).padStart(2,'0')+' · '+col[1];
  document.getElementById('ttitle').textContent=name;
  document.getElementById('tis').textContent=spec[0];
  document.getElementById('tmeta').innerHTML='<span>Tool '+String(num).padStart(3,'0')+' of 200</span>'
    +'<span>'+arc[0]+'</span>'+(live?'<span class="gold">Full instrument on the Toolkit page</span>':'<span class="gold">Working draft</span>');

  /* ---- archetype ---- */
  function archOf(n){
    if(/Assessment|Scorecard|Index|Audit|Profile$/i.test(n)) return 'scale';
    if(/Interview|Conversation|Questions/i.test(n)) return 'interview';
    if(/\bMap\b|Mapping/i.test(n)) return 'map';
    if(/Plan\b|Planner|Roadmap|Blueprint|Timeline|Calendar|Ladder/i.test(n)) return 'plan';
    if(/Statement|Constitution|Policy|Covenant|Manifesto|Motto/i.test(n)) return 'statement';
    if(/Letter|Blessing/i.test(n)) return 'letter';
    if(/Inventory|Journal|Cards|List|Story Book|Timeline/i.test(n)) return 'inventory';
    if(/Meeting|Retreat|Kit|Agenda/i.test(n)) return 'meeting';
    if(/Journey|Curriculum|Pathway/i.test(n)) return 'journey';
    return 'worksheet';
  }
  var arch=archOf(name);

  var SCALE=['Not yet','Rarely','Sometimes','Mostly','Consistently'];
  var K='flti:'+name.replace(/[^A-Za-z0-9]/g,'').slice(0,40)+':';
  function get(k){return FLstore.get(K+k)||''}
  function set(k,v){FLstore.set(K+k,v); var s=document.getElementById('svd'); s.classList.add('on'); clearTimeout(window._t); window._t=setTimeout(function(){s.classList.remove('on')},1100); render();}

  /* ---- field builders per archetype ---- */
  var F=[];  /* {step, key, label, type} */
  function build(){
    F=[];
    if(arch==='scale'){
      shape.forEach(function(st,si){
        for(var i=0;i<3;i++) F.push({s:si,k:'s'+si+'_'+i,l:st+' — statement '+(i+1),type:'scale'});
      });
      F.push({s:2,k:'note',l:'What this score tells us',type:'area'});
    } else if(arch==='interview'){
      shape.forEach(function(st,si){
        F.push({s:si,k:'q'+si+'a',l:st,type:'area',ph:'The question you will ask…'});
        F.push({s:si,k:'q'+si+'b',l:'What came back, in their words',type:'area',ph:'Not your summary — theirs…'});
      });
    } else if(arch==='map'){
      shape.forEach(function(st,si){
        for(var i=0;i<2;i++) F.push({s:si,k:'m'+si+'_'+i,l:i===0?st:'',type:'tri',ph:['Person','Relationship to the family','Current state']});
      });
    } else if(arch==='plan'){
      shape.forEach(function(st,si){
        for(var i=0;i<2;i++) F.push({s:si,k:'p'+si+'_'+i,l:i===0?st:'',type:'tri',ph:['What happens','Who owns it','By when']});
      });
    } else if(arch==='statement'){
      shape.forEach(function(st,si){ F.push({s:si,k:'d'+si,l:st,type:'area'}); });
      F.push({s:2,k:'final',l:'The statement, as this family would sign it',type:'area',ph:'Write it in one paragraph…'});
    } else if(arch==='letter'){
      shape.forEach(function(st,si){ F.push({s:si,k:'l'+si,l:st,type:'area'}); });
      F.push({s:2,k:'to',l:'Written to',type:'text'});
    } else if(arch==='inventory'){
      shape.forEach(function(st,si){
        for(var i=0;i<3;i++) F.push({s:si,k:'i'+si+'_'+i,l:i===0?st:'',type:'pair',ph:['Item','Why it matters']});
      });
    } else if(arch==='meeting'){
      shape.forEach(function(st,si){
        for(var i=0;i<2;i++) F.push({s:si,k:'a'+si+'_'+i,l:i===0?st:'',type:'tri',ph:['Agenda item','Who leads','Minutes']});
      });
    } else if(arch==='journey'){
      shape.forEach(function(st,si){
        F.push({s:si,k:'j'+si,l:st,type:'area',ph:'What this stretch of the journey covers…'});
        F.push({s:si,k:'jd'+si,l:'Days or sessions',type:'text',ph:'e.g. Days 1–10'});
      });
    } else {
      shape.forEach(function(st,si){
        F.push({s:si,k:'w'+si+'a',l:st,type:'area'});
        F.push({s:si,k:'w'+si+'b',l:'What we noticed',type:'area'});
      });
    }
    var h='';
    shape.forEach(function(st,si){
      h+='<div class="stepblk"><div class="sh"><i>'+(si+1)+'</i><b>'+st+'</b></div>';
      if(arch==='scale'&&si===0) h+='<p class="scnote">Answer honestly rather than aspirationally. 1 is not yet, 5 is consistently.</p>';
      F.filter(function(f){return f.s===si}).forEach(function(f){
        var v=get(f.k);
        if(f.type==='scale'){
          h+='<div class="scaler"><p>'+f.l+'</p><span class="sc">'
            +SCALE.map(function(_,i){return '<button type="button" data-k="'+f.k+'" data-v="'+(i+1)+'"'+(v==(i+1)?' class="sel"':'')+'>'+(i+1)+'</button>';}).join('')
            +'</span></div>';
        } else if(f.type==='pair'||f.type==='tri'){
          var ph=f.ph, n=f.type==='pair'?2:3;
          h+=(f.l?'<label style="display:block;font-weight:600;font-size:12.3px;color:#33452F;margin:13px 0 6px">'+f.l+'</label>':'')
            +'<div class="'+(f.type==='pair'?'rowpair':'rowtri')+'">';
          for(var j=0;j<n;j++) h+='<input type="text" data-k="'+f.k+'_'+j+'" value="'+(get(f.k+'_'+j).replace(/"/g,'&quot;'))+'" placeholder="'+ph[j]+'">';
          h+='</div>';
        } else if(f.type==='text'){
          h+='<div class="fld"><label>'+f.l+'</label><input type="text" data-k="'+f.k+'" value="'+v.replace(/"/g,'&quot;')+'" placeholder="'+(f.ph||'')+'"></div>';
        } else {
          h+='<div class="fld"><label>'+f.l+'</label><textarea data-k="'+f.k+'" placeholder="'+(f.ph||'')+'">'+v+'</textarea></div>';
        }
      });
      h+='</div>';
    });
    document.getElementById('form').innerHTML=h;
  }

  /* ---- printed card ---- */
  function render(){
    document.getElementById('ptk').textContent=col[1]+' · Working Copy';
    document.getElementById('ph').textContent=name;
    document.getElementById('pdt').textContent=spec[0];
    var h='';
    if(arch==='scale'){
      var tot=0,cnt=0;
      F.forEach(function(f){ if(f.type==='scale'){ var v=+get(f.k); if(v){tot+=v;cnt++;} }});
      var max=F.filter(function(f){return f.type==='scale'}).length*5;
      h+='<div class="pscore"><b>'+(cnt?tot:'—')+'</b><span>of '+max+' · '+cnt+' of '+(max/5)+' answered</span></div>';
      var n=get('note'); h+='<div class="psec"><b>What this tells us</b><p'+(n?'':' class="em"')+'>'+(n||'To be written once the scoring is done.')+'</p></div>';
    } else {
      shape.forEach(function(st,si){
        var rows='';
        F.filter(function(f){return f.s===si}).forEach(function(f){
          if(f.type==='pair'||f.type==='tri'){
            var n=f.type==='pair'?2:3, parts=[];
            for(var j=0;j<n;j++){ var vv=get(f.k+'_'+j); if(vv) parts.push(vv); }
            if(parts.length) rows+='<p>'+parts.join(' &middot; ')+'</p>';
          } else {
            var v=get(f.k); if(v) rows+='<p>'+(f.l&&f.type!=='area'?'<i>'+f.l+':</i> ':'')+v+'</p>';
          }
        });
        h+='<div class="psec"><b>'+st+'</b>'+(rows||'<p class="em">Nothing entered yet.</p>')+'</div>';
      });
    }
    document.getElementById('pbody').innerHTML=h;
    document.getElementById('pprod').textContent='What it produces: '+spec[1];
  }

  document.getElementById('form').addEventListener('input',function(e){
    var el=e.target; if(el.dataset.k) set(el.dataset.k, el.value);
  });
  document.getElementById('form').addEventListener('click',function(e){
    var b=e.target.closest('button[data-k]'); if(!b) return;
    b.parentElement.querySelectorAll('button').forEach(function(x){x.classList.remove('sel')});
    b.classList.add('sel'); set(b.dataset.k, b.dataset.v);
  });
  document.getElementById('printbtn').addEventListener('click',function(){
    document.body.classList.add('printing'); window.print();
  });
  window.addEventListener('afterprint',function(){document.body.classList.remove('printing')});

  var nxt=col[2][(idx+1)%col[2].length];
  var nl=document.getElementById('nextlink');
  nl.href='tool.html?t='+encodeURIComponent(nxt); nl.textContent=nxt+' →';

  build(); render();
})();
</script>
</body>
</html>
