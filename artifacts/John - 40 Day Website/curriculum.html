<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curriculum — 40 Day Campaigns</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16161D;--ink-2:#3A3A45;--dim:#5E5E6B;--faint:#8A8A98;--orange:#F26C1E;--orange-d:#DE5E12;--gold:#E4AC43;--line:#EAE7F0;--card:#F4F2F8;
--c1a:#16A88F;--c1b:#0C5A4E;--c2a:#C8484C;--c2b:#7E2326;--c3a:#4F86E0;--c3b:#26417F;--c4a:#E0703F;--c4b:#8A3A1E;--c5a:#E8A52E;--c5b:#9A6810;--c6a:#36A85E;--c6b:#176233;--c7a:#7B5FE0;--c7b:#3F2E86;--c8a:#E2542F;--c8b:#8A2A14;--c9a:#5A6B8C;--c9b:#2E3A52;--c10a:#C99A3C;--c10b:#7E601C;--c11a:#3E8FB0;--c11b:#1D4B60;--c12a:#B0578D;--c12b:#5F2A4C;}
*{box-sizing:border-box}body{margin:0;font-family:'Hanken Grotesk',sans-serif;color:var(--ink);background:var(--card)}
.wrap{max-width:900px;margin:0 auto;padding:0 24px}
.docbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:22px 0 14px}
.btn{border-radius:999px;padding:10px 16px;font-weight:800;font-size:13.5px;text-decoration:none;cursor:pointer;border:0;font-family:'Hanken Grotesk',sans-serif;display:inline-flex;align-items:center;gap:7px}
.btn-white{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn-orange{background:var(--orange);color:#fff}
.sp{font-size:12px;color:var(--faint);font-family:'Inter',sans-serif}
.fmts{display:flex;gap:6px;flex-wrap:wrap;padding:0 0 18px}
.fp{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700;color:var(--ink-2);text-decoration:none}
.fp.on{background:var(--ink);border-color:var(--ink);color:#fff}
.doc{background:#fff;border:1px solid var(--line);border-radius:20px;padding:clamp(26px,5vw,58px);margin-bottom:60px;box-shadow:0 18px 50px rgba(22,22,29,.08)}
.cover{text-align:center;padding:14px 0 34px;border-bottom:2px solid var(--ink);margin-bottom:34px}
.tabx{display:inline-block;background:linear-gradient(135deg,var(--ca),var(--cb));color:#fff;border-radius:999px;padding:7px 15px;font-size:10.5px;font-weight:800;letter-spacing:.14em}
.cover h1{font-size:clamp(30px,5vw,46px);letter-spacing:-.8px;margin:16px 0 8px;line-height:1.05}
.cover .sub{color:var(--dim);font-family:'Inter',sans-serif;font-size:14.5px;line-height:1.6}
.day{padding:26px 0;border-bottom:1px solid var(--line)}
.day:last-of-type{border-bottom:0}
.dhead{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.dn{background:linear-gradient(135deg,var(--ca),var(--cb));color:#fff;border-radius:9px;padding:5px 11px;font-size:11px;font-weight:900;letter-spacing:.08em;white-space:nowrap}
.dl{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.dth{font-size:22px;font-weight:900;letter-spacing:-.3px;margin:2px 0 12px}
.mem{background:#F7F4EC;border-left:3px solid var(--gold);border-radius:0 12px 12px 0;padding:13px 16px;margin:0 0 12px;font-family:Georgia,serif;font-style:italic;font-size:14.5px;color:#5c4a1e;line-height:1.55}
.mem b{display:block;font-family:'Hanken Grotesk',sans-serif;font-style:normal;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#9A6810;margin-top:7px}
.scr{background:#F2F6FB;border-left:3px solid #4F86E0;border-radius:0 12px 12px 0;padding:10px 16px;margin:0 0 14px;font-size:12.5px;font-weight:700;letter-spacing:.04em;color:#26417F;font-family:'Inter',sans-serif}
.lbl{font-size:10.5px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--orange);margin:18px 0 6px}
.body p{font-family:'Inter',sans-serif;font-size:14.5px;line-height:1.75;color:var(--ink-2);margin:0 0 13px}
.pq{font-family:'Inter',sans-serif;font-size:14px;line-height:1.7;color:var(--ink-2);margin:0}
.se{padding:26px 0;border-bottom:1px solid var(--line)}
.se:last-of-type{border-bottom:0}
.mv{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 17px;margin:12px 0}
.mv .mt{font-weight:800;font-size:14.5px}
.mv .ms{font-size:11.5px;color:#26417F;font-weight:700;font-family:'Inter',sans-serif;margin:2px 0 8px}
.mv p{font-family:'Inter',sans-serif;font-size:13.5px;line-height:1.65;color:var(--ink-2);margin:0 0 7px}
ul.plain{margin:6px 0 0;padding-left:20px}
ul.plain li{font-family:'Inter',sans-serif;font-size:13.5px;line-height:1.7;color:var(--ink-2);margin-bottom:5px}
.footer-note{text-align:center;margin-top:30px;font-size:10.5px;letter-spacing:.1em;color:var(--faint);line-height:1.8}
@media print{ .ltnav,.docbar,.fmts,footer,.ltdrawer{display:none!important} body{background:#fff} .doc{border:0;box-shadow:none;border-radius:0;padding:0} .day,.se{page-break-inside:avoid} }
footer{background:var(--ink);color:rgba(255,255,255,.75);font-family:'Inter',sans-serif;font-size:13px}
footer .fbar{max-width:1240px;margin:0 auto;padding:22px 28px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
footer a{color:rgba(255,255,255,.7)}
</style>
</head>
<body>
<div class="wrap">
  <div class="docbar">
    <a class="btn btn-white" id="back" href="browse.html">&#8592; Back to campaign</a>
    <button class="btn btn-orange" onclick="window.print()">Download PDF <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 3v12M7 11l5 5 5-5M4 21h16"/></svg></button>
    <span class="sp">In the print dialog, choose &ldquo;Save as PDF&rdquo;</span>
  </div>
  <div class="fmts" id="fmts"></div>
  <div class="doc" id="doc"></div>
</div>
<footer><div class="fbar">
  <span>© 2026 40daycampaigns.com · Built in the Purpose Driven tradition</span>
  <span>533 hand-curated campaigns · 59 themes · 12 categories · NIV throughout · <a href="contact.html">Say hello</a></span>
</div></footer>
<script src="data.js"></script><script src="engine.js"></script><script src="cart.js"></script>
<script>
const HUE={1:['var(--c1a)','var(--c1b)'],2:['var(--c2a)','var(--c2b)'],3:['var(--c3a)','var(--c3b)'],4:['var(--c4a)','var(--c4b)'],5:['var(--c5a)','var(--c5b)'],6:['var(--c6a)','var(--c6b)'],7:['var(--c7a)','var(--c7b)'],8:['var(--c8a)','var(--c8b)'],9:['var(--c9a)','var(--c9b)'],10:['var(--c10a)','var(--c10b)'],11:['var(--c11a)','var(--c11b)'],12:['var(--c12a)','var(--c12b)']};
const P=new URLSearchParams(location.search);
const C=Engine.get(P.get('id'))||window.CAMPAIGNS.find(r=>r[9]==='C04001');
const FMTS=['40-Day','30-Day','21-Day','7-Day','6-Week','Youth','Kids','Leader Kit'];
let fmt=P.get('fmt')||C[3]; if(!FMTS.includes(fmt)) fmt=C[3]==='6-Week'?'6-Week':C[3];
const [ca,cb]=HUE[C[2]];
document.documentElement.style.setProperty('--ca',ca);
document.documentElement.style.setProperty('--cb',cb);
document.getElementById('back').href='campaign.html?id='+C[9];
document.title=C[0]+' — '+fmt+' — 40 Day Campaigns';
document.getElementById('fmts').innerHTML=FMTS.map(f=>`<a class="fp ${f===fmt?'on':''}" href="curriculum.html?id=${C[9]}&fmt=${encodeURIComponent(f)}">${f}</a>`).join('');

const NOTICE=`<div class="footer-note">${C[0].toUpperCase()} · COMPLETE ${fmt.toUpperCase()} EDITION · CONGREGATION-WIDE PRINT RIGHTS INCLUDED · 40DAYCAMPAIGNS.COM<br>MEMORY VERSES SHOWN IN THE KING JAMES VERSION (PUBLIC DOMAIN); DAILY READING REFERENCES NIV — FULL NIV TEXT SHIPS UNDER THE BIBLICA LICENSE AT LAUNCH</div>`;
function cover(kind){
  return `<div class="cover"><span class="tabx">${C[3].replace('-',' ').toUpperCase()} CAMPAIGN · ${kind.toUpperCase()}</span>
    <h1>${C[0]}</h1><div class="sub">${C[1]?C[1]+'<br>':''}${window.CATS[C[2]]} · ${C[10]} · Anchored in ${C[13]} (NIV)</div></div>`;
}
let h='';

if(['40-Day','30-Day','21-Day','7-Day'].includes(fmt)){
  const dev=Engine.devotional(C,fmt);
  h=cover(dev.label);
  h+=`<div class="se" style="padding-top:0"><div class="lbl">The journey at a glance</div><ul class="plain">${dev.parts.map(p=>`<li><b>Part ${p.n} — ${p.title}</b> · ${p.days}</li>`).join('')}</ul></div>`;
  dev.days.forEach(d=>{
    h+=`<div class="day"><div class="dhead"><span class="dn">${d.dn}</span><span class="dl">${d.wk}</span></div>
      <div class="dth">${d.title}</div>
      <div class="mem">&ldquo;${d.mem.t}&rdquo;<b>This week's memory verse · ${d.mem.v} (KJV)</b></div>
      <div class="scr">Today's reading: ${d.scr}</div>
      <div class="lbl">Reflect</div><div class="body">${d.body}</div>
      <div class="lbl">Pray</div><p class="pq">${d.pray}</p>
      <div class="lbl">Reflect &amp; Respond</div><p class="pq">${d.q}</p>
      <div class="lbl">One Step Today</div><p class="pq">${d.step}</p></div>`;
  });
}
else if(fmt==='6-Week'){
  const gs=Engine.groupStudy(C);
  h=cover('6-Session Group Study');
  gs.sessions.forEach(s=>{
    h+=`<div class="se"><div class="dhead"><span class="dn">SESSION ${s.n}</span><span class="dl">${C[0]} · Small-Group Study</span></div>
      <div class="dth">${s.title}${s.sub?` — ${s.sub}`:''}</div>
      <div class="mem">Big idea: &ldquo;${s.big}&rdquo;<b>Key scripture · ${s.key} · with ${s.support.join(' · ')}</b></div>
      <div class="lbl">Welcome (10 min)</div><p class="pq">${s.welcome}</p>
      <div class="lbl">Opening question</div><p class="pq">${s.openQ}</p>
      <div class="lbl">Four movements (35–40 min)</div>
      ${s.movements.map((m,i)=>`<div class="mv"><div class="mt">${i+1}. ${m.t}</div><div class="ms">${m.scr}</div><p>${m.ex}</p><p><b>Discuss:</b> ${m.dq}</p><p><b>Apply:</b> ${m.app}</p></div>`).join('')}
      <div class="lbl">More discussion questions</div><ul class="plain">${s.dqs.map(q=>`<li>${q}</li>`).join('')}</ul>
      <div class="lbl">This week's practice</div><p class="pq">${s.practice}</p>
      ${s.challenge?`<div class="lbl">Weekly challenge</div><p class="pq">${s.challenge}</p>`:''}
      <div class="lbl">Close (10 min)</div><p class="pq">${s.close}</p></div>`;
  });
}
else if(fmt==='Youth'){
  const ys=Engine.youth(C);
  h=cover('Youth Edition');
  ys.forEach(s=>{
    h+=`<div class="se"><div class="dhead"><span class="dn">WEEK ${s.n}</span><span class="dl">${C[0]} · Youth Edition</span></div>
      <div class="dth">${s.title}</div>
      <div class="mem">&ldquo;${s.truth}&rdquo;<b>Key scripture · ${s.scr}</b></div>
      <div class="lbl">The hook</div><p class="pq">${s.hook}</p>
      <div class="lbl">Talk it out</div><ul class="plain">${s.dqs.map(q=>`<li>${q}</li>`).join('')}</ul>
      <div class="lbl">This week's challenge</div><p class="pq">${s.challenge}</p></div>`;
  });
}
else if(fmt==='Kids'){
  const ks=Engine.children(C);
  h=cover("Children's Edition");
  ks.forEach(s=>{
    h+=`<div class="se"><div class="dhead"><span class="dn">WEEK ${s.n}</span><span class="dl">${C[0]} · Children's Edition</span></div>
      <div class="dth">${s.title}</div>
      <div class="mem">Big truth: &ldquo;${s.bigTruth}&rdquo;<b>Memory verse · ${s.verse}</b></div>
      <div class="lbl">Tell the story</div><p class="pq">${s.story}</p>
      <div class="lbl">Do together</div><p class="pq">${s.activity}</p>
      <div class="lbl">Ask</div><p class="pq">${s.question}</p>
      <div class="lbl">Pray</div><p class="pq">${s.prayer}</p></div>`;
  });
}
else if(fmt==='Leader Kit'){
  const lk=Engine.leaderKit(C), la=Engine.launchKit(C);
  h=cover('Leader & Launch Kit');
  h+=`<div class="se"><div class="dth">Host tips — you can do this</div><ul class="plain">${lk.hostTips.map(x=>`<li>${x}</li>`).join('')}</ul></div>
  <div class="se"><div class="dth">The weekly rhythm</div><ul class="plain">${lk.rhythm.map(x=>`<li>${x}</li>`).join('')}</ul></div>
  <div class="se"><div class="dth">Shepherding your group</div><ul class="plain">${lk.care.map(x=>`<li>${x}</li>`).join('')}</ul></div>
  <div class="se"><div class="dth">Before every session</div><ul class="plain">${lk.checklist.map(x=>`<li>${x}</li>`).join('')}</ul></div>
  <div class="se"><div class="dth">Churchwide launch runway</div>${la.runway.map(w=>`<div class="mv"><div class="mt">${w.wk}</div><ul class="plain">${w.items.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}</div>
  <div class="se"><div class="dth">Sundays during the campaign</div><ul class="plain">${la.sunday.map(x=>`<li>${x}</li>`).join('')}</ul></div>
  <div class="se"><div class="dth">Celebration Sunday</div><ul class="plain">${la.celebration.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
}
h+=NOTICE;
document.getElementById('doc').innerHTML=h;
</script>
</body>
</html>
