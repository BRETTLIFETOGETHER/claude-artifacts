<svg viewBox="0 0 1100 850" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF8F1"/>
      <stop offset="1" stop-color="#F4EEE1"/>
    </linearGradient>
    <radialGradient id="mound" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#F6ECD6"/>
    </radialGradient>
    <filter id="card" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1B2A4A" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,1 L8,5 L0,9 Z" fill="#B8860B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="850" fill="url(#sky)"/>

  <!-- TITLE -->
  <text x="550" y="50" text-anchor="middle" fill="#1B2A4A" font-size="29" font-weight="bold">The Financial Wisdom Ministry Diamond</text>
  <text x="550" y="74" text-anchor="middle" fill="#7A6A45" font-size="15" font-style="italic">Pastor first &#183; one base at a time &#183; from conviction to movement</text>

  <!-- OUTFIELD : GREAT COMMISSION -->
  <path d="M 170 162 Q 550 132 930 162 L 930 92 L 170 92 Z" fill="#E7EEDF" opacity="0.5"/>
  <path d="M 170 162 Q 550 132 930 162" fill="none" stroke="#5C7A52" stroke-width="2.5" opacity="0.6"/>
  <text x="550" y="120" text-anchor="middle" fill="#3F5B36" font-size="25" font-weight="bold" letter-spacing="3">THE GREAT COMMISSION</text>
  <text x="550" y="144" text-anchor="middle" fill="#5C7A52" font-size="14" font-style="italic">the reason we play — every base exists to make disciples</text>

  <!-- INFIELD DIAMOND : 2nd(550,308) 1st(778,480) home(550,652) 3rd(322,480) -->
  <polygon points="550,308 778,480 550,652 322,480" fill="#EFE2C8" stroke="#C9A86A" stroke-width="2.5"/>
  <polygon points="550,308 778,480 550,652 322,480" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.35"/>

  <!-- base path arrows : home -> 1st -> 2nd -> 3rd -> home -->
  <line x1="566" y1="640" x2="762" y2="492" stroke="#B8860B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="762" y1="468" x2="566" y2="320" stroke="#B8860B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="534" y1="320" x2="338" y2="468" stroke="#B8860B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="338" y1="492" x2="534" y2="640" stroke="#B8860B" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- MOUND : THE HOME RUN (heart of the field) -->
  <circle cx="550" cy="480" r="118" fill="url(#mound)" stroke="#C9A86A" stroke-width="2"/>
  <polygon points="550,433 552.6,440.4 560.5,440.6 554.3,445.4 556.5,452.9 550,448.5 543.5,452.9 545.7,445.4 539.5,440.6 547.4,440.4" fill="#B8860B"/>
  <text x="550" y="468" text-anchor="middle" fill="#1B2A4A" font-size="15" font-weight="bold" letter-spacing="2">THE HOME RUN</text>
  <text x="550" y="489" text-anchor="middle" fill="#33425E" font-size="12.5">Launch an ongoing</text>
  <text x="550" y="508" text-anchor="middle" fill="#1B2A4A" font-size="13.5" font-weight="bold">Financial Wisdom Ministry</text>
  <text x="550" y="528" text-anchor="middle" fill="#5C7A52" font-size="11.5" font-style="italic">repeated &#8594; it becomes a MOVEMENT</text>

  <!-- BASE MARKERS -->
  <g stroke="#1B2A4A" stroke-width="1.5">
    <rect x="768" y="470" width="20" height="20" rx="2" fill="#FFFFFF" transform="rotate(45 778 480)"/>
    <rect x="540" y="298" width="20" height="20" rx="2" fill="#FFFFFF" transform="rotate(45 550 308)"/>
    <rect x="312" y="470" width="20" height="20" rx="2" fill="#FFFFFF" transform="rotate(45 322 480)"/>
  </g>
  <polygon points="535,642 565,642 565,655 550,666 535,655" fill="#C8A24A" stroke="#1B2A4A" stroke-width="1.5"/>

  <!-- 2ND BASE CARD -->
  <g filter="url(#card)">
    <rect x="415" y="170" width="270" height="116" rx="10" fill="#FFFFFF" stroke="#E2D6BC"/>
    <rect x="415" y="170" width="6" height="116" rx="3" fill="#B8860B"/>
  </g>
  <text x="435" y="194" fill="#B8860B" font-size="12.5" font-weight="bold" letter-spacing="2">2ND BASE &#183; CULTURE</text>
  <text x="435" y="217" fill="#1B2A4A" font-size="16.5" font-weight="bold">Financial Wisdom Culture</text>
  <text x="435" y="240" fill="#33425E" font-size="12">Q: How do we build a wisdom culture</text>
  <text x="435" y="255" fill="#33425E" font-size="12">bigger than stewardship and giving?</text>
  <text x="435" y="276" fill="#5C7A52" font-size="11.5" font-style="italic">Who: pastor, spouse, key staff &amp; elders</text>

  <!-- 1ST BASE CARD -->
  <g filter="url(#card)">
    <rect x="802" y="420" width="278" height="120" rx="10" fill="#FFFFFF" stroke="#E2D6BC"/>
    <rect x="802" y="420" width="6" height="120" rx="3" fill="#B8860B"/>
  </g>
  <text x="822" y="444" fill="#B8860B" font-size="12.5" font-weight="bold" letter-spacing="2">1ST BASE &#183; WHY</text>
  <text x="822" y="467" fill="#1B2A4A" font-size="15" font-weight="bold">Wisdom Changes Everything</text>
  <text x="822" y="490" fill="#33425E" font-size="12">Q: Why treat financial wisdom as</text>
  <text x="822" y="505" fill="#33425E" font-size="12">core discipleship, not a money class?</text>
  <text x="822" y="526" fill="#5C7A52" font-size="11.5" font-style="italic">Who: the senior pastor (conviction)</text>

  <!-- 3RD BASE CARD -->
  <g filter="url(#card)">
    <rect x="18" y="420" width="276" height="120" rx="10" fill="#FFFFFF" stroke="#E2D6BC"/>
    <rect x="18" y="420" width="6" height="120" rx="3" fill="#B8860B"/>
  </g>
  <text x="40" y="444" fill="#B8860B" font-size="12.5" font-weight="bold" letter-spacing="2">3RD BASE &#183; CAMPAIGNS</text>
  <text x="40" y="467" fill="#1B2A4A" font-size="16.5" font-weight="bold">Financial Wisdom Campaigns</text>
  <text x="40" y="490" fill="#33425E" font-size="12">Q: How do we mobilize the whole</text>
  <text x="40" y="505" fill="#33425E" font-size="12">church? (the 10 campaigns &amp; courses)</text>
  <text x="40" y="526" fill="#5C7A52" font-size="11.5" font-style="italic">Who: the congregation / members</text>

  <!-- DUGOUT : PASTOR ADVISOR -->
  <g filter="url(#card)">
    <rect x="18" y="590" width="300" height="98" rx="10" fill="#33422E"/>
    <rect x="18" y="590" width="6" height="98" rx="3" fill="#C8A24A"/>
  </g>
  <text x="40" y="615" fill="#C8A24A" font-size="12.5" font-weight="bold" letter-spacing="2">THE DUGOUT</text>
  <text x="40" y="636" fill="#FFFFFF" font-size="16" font-weight="bold">The Pastor Advisor</text>
  <text x="40" y="656" fill="#D7DED1" font-size="11.5">Personal financial care for pastor &amp; spouse.</text>
  <text x="40" y="671" fill="#D7DED1" font-size="11.5">Not sequential, but essential — runs anytime;</text>
  <text x="40" y="683" fill="#D7DED1" font-size="11.5" font-style="italic">often what frees a worn-out pastor to swing.</text>

  <!-- HOME CARD : THE PASTOR -->
  <g filter="url(#card)">
    <rect x="368" y="700" width="364" height="94" rx="10" fill="#1B2A4A"/>
    <rect x="368" y="700" width="6" height="94" rx="3" fill="#C8A24A"/>
  </g>
  <circle cx="399" cy="721" r="7" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="1"/>
  <path d="M396 715.5 Q399 721 396 726.5" fill="none" stroke="#C0392B" stroke-width="1"/>
  <path d="M402 715.5 Q399 721 402 726.5" fill="none" stroke="#C0392B" stroke-width="1"/>
  <text x="414" y="726" fill="#C8A24A" font-size="13" font-weight="bold" letter-spacing="2">STEP UP TO THE PLATE</text>
  <text x="392" y="752" fill="#FFFFFF" font-size="21" font-weight="bold">The Pastor</text>
  <text x="392" y="774" fill="#C7D0E0" font-size="12.5">The catalyst — nothing moves until he swings.</text>
  <text x="392" y="790" fill="#C7D0E0" font-size="12.5">He rounds the bases, then comes home to score.</text>

  <!-- FOOTER : the second diamond -->
  <rect x="735" y="602" width="347" height="86" rx="10" fill="#F0EAD9" stroke="#E2D6BC"/>
  <text x="908" y="626" text-anchor="middle" fill="#7A6A45" font-size="11.5" font-weight="bold" letter-spacing="1">INSIDE THE MINISTRY: THE SECOND DIAMOND</text>
  <text x="908" y="650" text-anchor="middle" fill="#33425E" font-size="12">Every member rounds their own bases —</text>
  <text x="908" y="672" text-anchor="middle" fill="#1B2A4A" font-size="12.5" font-weight="bold">Struggling &#8594; Surviving &#8594; Stable &#8594; Secure &#8594; Surplus</text>
</svg>
