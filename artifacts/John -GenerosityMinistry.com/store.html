<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Generosity Track Library — Generosity Ministry</title>
<meta name="description" content="251 ready-to-launch generosity campaigns across seven tracks. Browse, view the full written campaign, and license it for your church.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#141C18;--bg2:#1B2620;--panel:#20302A;--panel2:#26372F;--cream:#F3F1E7;--dim:#9FB0A5;--faint:#6E8177;--brass:#C6A65E;--brass2:#E0C583;--line:rgba(198,166,94,.22);--rule:rgba(243,241,231,.1);
/* cover duotones per track */
--t1a:#2E6B4F;--t1b:#123324;--t2a:#7A5A2E;--t2b:#3A2A12;--t3a:#8C6E3A;--t3b:#4A3616;--t4a:#3E5E72;--t4b:#1B2E3C;--t5a:#57746B;--t5b:#26382F;--t6a:#7A3E38;--t6b:#3C1B18;--t7a:#5E4E7A;--t7b:#2C2340}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--cream);font-family:'Inter',sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
::selection{background:var(--brass);color:var(--bg)}
a{color:inherit;text-decoration:none}
img{max-width:100%}
.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(1.2rem,4vw,3rem)}
h1{font-family:'Fraunces',serif;font-weight:400;font-size:clamp(2.2rem,7vw,4.6rem);line-height:.99;letter-spacing:-.02em}
h1 em,h2 em{font-style:italic;color:var(--brass2)}
h2{font-family:'Fraunces',serif;font-weight:400;font-size:clamp(1.6rem,4.4vw,2.6rem);line-height:1.04;letter-spacing:-.015em}
h3{font-family:'Fraunces',serif;font-weight:600}
.kick{font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--brass);font-weight:600;margin-bottom:.4rem}
.dek{color:var(--dim);max-width:66ch;font-size:.92rem;margin-top:.6rem}
section{padding:clamp(2.4rem,6vw,4.2rem) 0;border-bottom:1px solid var(--rule)}
.sh-head{display:grid;grid-template-columns:auto 1fr;gap:1.4rem;align-items:start;margin-bottom:1.4rem}
.big-n{font-family:'Fraunces',serif;font-size:clamp(2.4rem,6vw,3.8rem);line-height:.8;color:var(--brass);opacity:.5}

/* ---------- HEADER ---------- */
.hd{position:sticky;top:0;z-index:40;background:rgba(20,28,24,.96);backdrop-filter:blur(9px);border-bottom:1px solid var(--line)}
.hd-in{display:flex;align-items:center;gap:1.2rem;padding:.7rem 0}
.logo{display:flex;align-items:center;gap:.65rem;flex:none}
.logo .mk{width:34px;height:34px;border-radius:7px;background:linear-gradient(135deg,var(--brass),#8f7233);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;color:var(--bg);font-size:.95rem;flex:none}
.logo .nm{font-family:'Fraunces',serif;font-size:1rem;line-height:1.05}
.logo .nm span{color:var(--brass2);font-style:italic}
.hd-nav{display:flex;gap:1.15rem;overflow-x:auto;font-size:.76rem;letter-spacing:.05em;flex:1;padding:.2rem 0}
.hd-nav a{color:var(--dim);white-space:nowrap;padding:.25rem 0;border-bottom:2px solid transparent}
.hd-nav a:hover{color:var(--brass2)}
.hd-nav a.on{color:var(--brass2);border-bottom-color:var(--brass)}
.cartbtn{flex:none;position:relative;display:flex;align-items:center;gap:.5rem;background:var(--panel);border:1px solid var(--line);color:var(--cream);padding:.5rem .9rem;border-radius:999px;cursor:pointer;font-family:'Inter',sans-serif;font-size:.76rem;font-weight:600}
.cartbtn:hover{border-color:var(--brass)}
.cartn{background:var(--brass);color:var(--bg);font-weight:700;font-size:.68rem;border-radius:999px;min-width:1.25rem;height:1.25rem;display:inline-flex;align-items:center;justify-content:center;padding:0 .3rem}
.cartn.zero{background:var(--rule);color:var(--dim)}

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;gap:.5rem;border:1px solid var(--brass);color:var(--bg);background:var(--brass);padding:.72rem 1.4rem;border-radius:3px;font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;font-family:'Inter',sans-serif;transition:.14s}
.btn:hover{background:var(--brass2);border-color:var(--brass2)}
.btn.ghost{background:transparent;color:var(--brass2)}
.btn.ghost:hover{border-color:var(--brass2)}
.btn.sm{padding:.45rem .85rem;font-size:.68rem}
.btn.wide{width:100%;justify-content:center}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.added{background:var(--panel2);border-color:var(--panel2);color:var(--brass2)}
.linkish{background:none;border:none;color:var(--faint);font-size:.74rem;font-family:'Inter',sans-serif;cursor:pointer;text-decoration:underline}
.linkish:hover{color:var(--brass2)}

/* ---------- HERO ---------- */
.hero{border-bottom:1px solid var(--line);padding:clamp(2.4rem,6vw,4.6rem) 0}
.hero-grid{display:grid;gap:2.4rem;align-items:center}
@media(min-width:920px){.hero-grid{grid-template-columns:1.05fr .95fr}}
.brandline{font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--brass);font-weight:600;margin-bottom:1.1rem}
.pitch{margin-top:1.2rem;max-width:56ch;font-size:clamp(.98rem,2.2vw,1.12rem);color:var(--dim)}
.hero-actions{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:1.5rem}
.trust{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1.4rem;color:var(--faint);font-size:.78rem;align-items:baseline}
.trust .v{font-family:'Fraunces',serif;color:var(--brass2);font-size:1rem;font-weight:600}
.cluster{position:relative;height:clamp(300px,38vw,430px)}
.cluster .cov{position:absolute;width:clamp(130px,15vw,180px);box-shadow:0 24px 44px -18px rgba(0,0,0,.7);transition:transform .2s}
.cluster .cov:hover{transform:translateY(-6px) rotate(0deg)!important;z-index:9}
.c-a{left:2%;top:8%;transform:rotate(-7deg);z-index:1}
.c-b{left:26%;top:0;transform:rotate(-2deg);z-index:2}
.c-c{left:50%;top:6%;transform:rotate(4deg);z-index:3}
.c-d{left:14%;top:44%;transform:rotate(3deg);z-index:4}
.c-e{left:41%;top:40%;transform:rotate(-4deg);z-index:5}

/* ---------- COVERS ---------- */
.cov{display:block;flex:none}
.canvas{aspect-ratio:2/2.75;border-radius:3px 7px 7px 3px;position:relative;overflow:hidden;padding:.85rem;display:flex;flex-direction:column;background:linear-gradient(150deg,var(--ca) 0%,var(--cb) 78%);cursor:pointer}
.canvas::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(0,0,0,0))}
.canvas::after{content:"";position:absolute;inset:8px;border:1px solid rgba(224,197,131,.4);border-radius:2px;pointer-events:none}
.cov .tab{font-size:.44rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(243,241,231,.85);font-weight:700}
.cov .tab span{display:block;color:var(--brass2);letter-spacing:.24em}
.cov .ttl{margin-top:auto;position:relative}
.cov .nm{font-family:'Fraunces',serif;font-size:clamp(.92rem,1.5vw,1.12rem);line-height:1.05;letter-spacing:-.01em;color:#fff}
.cov .sb{font-size:.56rem;color:rgba(243,241,231,.75);margin-top:.3rem;font-style:italic;font-family:'Fraunces',serif}
.cov .fmt{position:absolute;top:.7rem;right:.7rem;font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;background:rgba(0,0,0,.35);border:1px solid rgba(224,197,131,.45);color:var(--brass2);padding:.16rem .45rem;border-radius:999px}

/* scroller rows */
.rowhead{display:flex;align-items:center;justify-content:space-between;margin:1.6rem 0 .9rem}
.rowhead h3{font-size:1.15rem}
.rownav{display:flex;gap:.4rem}
.rarrow{background:var(--panel);border:1px solid var(--line);color:var(--dim);width:2.1rem;height:2.1rem;border-radius:999px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.rarrow:hover{color:var(--brass2);border-color:var(--brass)}
.covrow{display:flex;gap:1rem;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:.6rem}
.covrow .cov{width:clamp(150px,17vw,196px);scroll-snap-align:start}

/* tracks band */
.ways{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:1.4rem}
@media(min-width:760px){.ways{grid-template-columns:repeat(3,1fr)}}
.way{background:var(--bg);padding:1.35rem;cursor:pointer;transition:background .13s}
.way:hover{background:var(--panel)}
.way-n{font-family:'Fraunces',serif;color:var(--brass);font-size:.9rem}
.way-t{font-family:'Fraunces',serif;font-size:1.18rem;font-weight:600;margin:.4rem 0 .35rem}
.way-d{font-size:.85rem;color:var(--dim);line-height:1.45}
.way .cnt{margin-top:.6rem;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}

/* features */
.feats{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:1.4rem}
@media(min-width:820px){.feats{grid-template-columns:repeat(3,1fr)}}
.feat{background:var(--bg);padding:1.4rem}
.feat h3{font-size:1.12rem;margin-bottom:.8rem;color:var(--brass2)}
.it{display:flex;gap:.6rem;align-items:flex-start;font-size:.86rem;color:var(--dim);padding:.32rem 0}
.it::before{content:"\2713";color:var(--brass);font-weight:700;flex:none}
.fmt-chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1.2rem}
.fmt-chip{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line);color:var(--brass2);padding:.35rem .8rem;border-radius:999px}

/* testimonials */
.tcards{display:flex;gap:1rem;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:.6rem}
.tcard{flex:none;width:min(420px,88vw);scroll-snap-align:start;background:var(--panel);border:1px solid var(--line);padding:1.5rem}
.tcard .q{font-family:'Fraunces',serif;font-size:1.05rem;line-height:1.45;color:var(--cream)}
.tcard .who{display:flex;gap:.7rem;align-items:center;margin-top:1.1rem}
.tcard .av{width:2.4rem;height:2.4rem;border-radius:999px;background:linear-gradient(135deg,var(--brass),#7a6230);flex:none;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;color:var(--bg);font-weight:600}
.tcard .nm{font-weight:600;font-size:.9rem}
.tcard .ch{font-size:.76rem;color:var(--faint)}
.tcard .tst{display:flex;gap:1.4rem;margin-top:1rem;padding-top:.9rem;border-top:1px solid var(--rule);font-size:.72rem;color:var(--faint)}
.tcard .tst b{display:block;color:var(--brass2);font-family:'Fraunces',serif;font-size:.95rem}

/* faq */
.faq{border:1px solid var(--rule);border-radius:4px;margin-bottom:.6rem;background:var(--bg2)}
.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:1rem 1.2rem;font-family:'Fraunces',serif;font-weight:600;font-size:1rem}
.faq summary::-webkit-details-marker{display:none}
.faq .tog{color:var(--brass);font-size:1.1rem;flex:none}
.faq .body{padding:0 1.2rem 1.1rem;color:var(--dim);font-size:.88rem;line-height:1.55;max-width:75ch}

/* ---------- LIBRARY / BROWSE ---------- */
.toolbar{background:var(--panel);border:1px solid var(--line);padding:1.2rem;margin-top:1.2rem}
.search-row{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center}
.search-box{flex:1;min-width:230px;position:relative}
.search-box svg{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);opacity:.55}
.search-box input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--cream);font-family:'Inter',sans-serif;font-size:.92rem;padding:.75rem 1rem .75rem 2.5rem;border-radius:3px;outline:none}
.search-box input::placeholder{color:var(--faint)}
.search-box input:focus{border-color:var(--brass)}
.count{font-family:'Fraunces',serif;font-size:.95rem;color:var(--brass2);white-space:nowrap}
.chiplab{font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);font-weight:700;margin:1rem 0 .45rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{background:var(--bg);border:1px solid var(--rule);color:var(--dim);font-size:.72rem;font-weight:600;letter-spacing:.03em;padding:.38rem .8rem;border-radius:999px;cursor:pointer;transition:.14s;font-family:'Inter',sans-serif}
.chip:hover{border-color:var(--brass);color:var(--brass2)}
.chip.on{background:var(--brass);border-color:var(--brass);color:var(--bg)}
.lib{margin-top:1.6rem}
.tk{margin-bottom:2.2rem}
.tk-bar{display:flex;gap:1rem;align-items:baseline;border-bottom:2px solid var(--brass);padding-bottom:.5rem}
.tk-i{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);font-weight:700}
.tk-n{font-family:'Fraunces',serif;font-size:1.3rem;font-weight:600;flex:1}
.tk-c{font-family:'Fraunces',serif;font-size:1.3rem;color:var(--brass);opacity:.7}
.tk-d{font-size:.84rem;color:var(--faint);margin:.5rem 0 .3rem}
.rowset{border-top:1px solid var(--rule)}
.srow{display:grid;grid-template-columns:2.4em 1fr auto;gap:.2rem .8rem;padding:.65rem .4rem;border-bottom:1px solid var(--rule);align-items:center;cursor:pointer;transition:background .13s;border-left:2px solid transparent}
.srow:hover{background:var(--panel);border-left-color:var(--brass)}
@media(min-width:940px){.srow{grid-template-columns:2.6em minmax(180px,1fr) minmax(220px,1.3fr) auto auto auto}}
.r-n{font-family:'Fraunces',serif;font-size:.76rem;color:var(--brass);opacity:.75}
.r-t{font-family:'Fraunces',serif;font-size:1rem;font-weight:600;letter-spacing:-.005em}
.r-t mark,.r-s mark{background:rgba(198,166,94,.3);color:var(--brass2);border-radius:2px;padding:0 .06em}
.r-s{font-size:.82rem;color:var(--dim);grid-column:2}
@media(min-width:940px){.r-s{grid-column:3}}
.r-tags{display:none}
@media(min-width:940px){.r-tags{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:flex-end}}
.mini-tag{font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border:1px solid var(--rule);border-radius:999px;padding:.14rem .5rem;white-space:nowrap}
.r-price{font-family:'Fraunces',serif;color:var(--brass2);font-size:.92rem;white-space:nowrap}
.noresults{padding:2.4rem 1rem;text-align:center;color:var(--faint);font-size:.92rem;border:1px dashed var(--rule);margin-top:1rem}

/* ---------- CAMPAIGN PAGE ---------- */
.cmp-hero{display:grid;gap:2rem;padding-top:clamp(1.6rem,4vw,2.6rem)}
@media(min-width:900px){.cmp-hero{grid-template-columns:280px 1fr;gap:3rem;align-items:start}}
.cmp-hero .cov{width:min(280px,80vw)}
.cmp-hero .cov .canvas{box-shadow:0 26px 50px -20px rgba(0,0,0,.75)}
.crumb{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:.9rem}
.crumb a{color:var(--brass)}
.cmp-title{font-family:'Fraunces',serif;font-weight:400;font-size:clamp(1.9rem,5vw,3.1rem);line-height:1;letter-spacing:-.015em}
.cmp-sub{font-family:'Fraunces',serif;font-style:italic;font-size:1.08rem;color:var(--brass2);margin-top:.4rem}
.m-tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.9rem}
.pricebox{background:var(--panel);border:1px solid var(--line);padding:1.3rem;margin-top:1.3rem;max-width:520px}
.pricebox .pr{display:flex;align-items:baseline;gap:.6rem}
.pricebox .amt{font-family:'Fraunces',serif;font-size:2rem;color:var(--brass2)}
.pricebox .per{font-size:.74rem;color:var(--faint)}
.pricebox .lic{font-size:.78rem;color:var(--dim);margin:.5rem 0 .9rem;line-height:1.5}
.pricebox .row2{display:flex;gap:.6rem;flex-wrap:wrap}
.bundlenote{font-size:.7rem;color:var(--faint);margin-top:.7rem}
.bundlenote b{color:var(--brass2)}
.m-k{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);font-weight:700;margin:2rem 0 .6rem}
.m-p{color:var(--dim);font-size:.94rem;line-height:1.6;max-width:70ch;margin-bottom:.7rem}
.m-big{font-family:'Fraunces',serif;font-size:clamp(1.12rem,2.8vw,1.4rem);line-height:1.3;color:var(--cream);border-left:2px solid var(--brass);padding-left:1rem;max-width:56ch}
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.gl{background:var(--bg);padding:.85rem 1rem}
.gl .v{font-family:'Fraunces',serif;font-size:1.02rem;font-weight:600;color:var(--brass2)}
.gl .k{font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:.3rem}
.wk{display:grid;grid-template-columns:3.4rem 1fr;gap:.9rem;padding:.85rem 0;border-bottom:1px solid var(--rule)}
.wk:last-child{border-bottom:none}
.wk-n{font-family:'Fraunces',serif;color:var(--brass);opacity:.65;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;padding-top:.1rem}
.wk-t{font-family:'Fraunces',serif;font-size:1.08rem;font-weight:600;line-height:1.15}
.wk-d{font-size:.85rem;color:var(--dim);margin-top:.2rem;line-height:1.5;max-width:62ch}
.scr{display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
@media(min-width:640px){.scr{grid-template-columns:1fr 1fr}}
.sc{background:var(--panel);padding:.85rem 1rem}
.sc .ref{font-family:'Fraunces',serif;font-weight:600;font-size:.95rem;color:var(--brass2)}
.sc .why{font-size:.78rem;color:var(--dim);margin-top:.2rem;line-height:1.45}
.deploy{list-style:none;display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
@media(min-width:640px){.deploy{grid-template-columns:1fr 1fr}}
.deploy li{background:var(--bg);padding:.8rem 1rem;font-size:.85rem;color:var(--dim);display:flex;gap:.7rem;line-height:1.45}
.deploy li::before{content:"\2713";color:var(--brass);font-weight:700;flex:none}
.steps{counter-reset:st;border-top:1px solid var(--rule)}
.step{display:grid;grid-template-columns:2.4rem 1fr;gap:.9rem;padding:.8rem 0;border-bottom:1px solid var(--rule)}
.step::before{counter-increment:st;content:counter(st,decimal-leading-zero);font-family:'Fraunces',serif;color:var(--brass);opacity:.55;font-size:1.05rem}
.step b{font-family:'Fraunces',serif;font-weight:600;font-size:.98rem;display:block}
.step span{font-size:.83rem;color:var(--dim);line-height:1.5;display:block;margin-top:.15rem;max-width:62ch}

/* ---------- CART / CHECKOUT ---------- */
.cartline{display:grid;grid-template-columns:64px 1fr auto auto;gap:1rem;align-items:center;padding:1rem 0;border-bottom:1px solid var(--rule)}
.cartline .cov{width:64px}
.cartline .ti{font-family:'Fraunces',serif;font-weight:600;font-size:1.02rem}
.cartline .su{font-size:.78rem;color:var(--faint)}
.cartline .pr{font-family:'Fraunces',serif;color:var(--brass2)}
.summary{background:var(--panel);border:1px solid var(--line);padding:1.3rem;position:sticky;top:5rem}
.summary .li{display:flex;justify-content:space-between;font-size:.86rem;color:var(--dim);padding:.3rem 0}
.summary .li.tot{border-top:1px solid var(--line);margin-top:.6rem;padding-top:.7rem;color:var(--cream);font-family:'Fraunces',serif;font-size:1.1rem}
.summary .li.tot span:last-child{color:var(--brass2)}
.summary .save{color:var(--brass2)}
.cart-grid{display:grid;gap:2rem;margin-top:1.4rem}
@media(min-width:900px){.cart-grid{grid-template-columns:1.6fr 1fr;align-items:start}}
.empty{padding:3rem 1rem;text-align:center;border:1px dashed var(--rule);color:var(--faint)}
.empty h3{color:var(--cream);margin-bottom:.4rem}
label{display:block;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700;margin:1rem 0 .35rem}
input[type=text],input[type=email],input[type=tel],textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--cream);font-family:'Inter',sans-serif;font-size:.9rem;padding:.72rem .9rem;border-radius:3px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--brass)}
input.err,textarea.err{border-color:#c86b5a}
.errmsg{color:#e0a396;font-size:.74rem;margin-top:.3rem;display:none}
.errmsg.show{display:block}
.frm2{display:grid;gap:0 1rem}
@media(min-width:640px){.frm2{grid-template-columns:1fr 1fr}}
.payopt{display:flex;gap:.8rem;align-items:flex-start;border:1px solid var(--rule);border-radius:4px;padding:1rem;margin-top:.6rem;cursor:pointer}
.payopt input{width:auto;margin-top:.2rem;accent-color:var(--brass)}
.payopt b{font-family:'Fraunces',serif;font-size:.98rem;display:block}
.payopt span{font-size:.8rem;color:var(--dim);display:block;margin-top:.15rem;line-height:1.5}
.payopt.on{border-color:var(--brass);background:var(--panel)}
.confirmbox{background:var(--panel);border:1px solid var(--brass);padding:clamp(1.6rem,4vw,2.6rem);margin-top:1.4rem}
.ordno{font-family:'Fraunces',serif;font-size:1.5rem;color:var(--brass2)}
.toast{position:fixed;bottom:1.4rem;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel);border:1px solid var(--brass);color:var(--cream);padding:.8rem 1.3rem;border-radius:4px;font-size:.84rem;opacity:0;pointer-events:none;transition:.25s;z-index:99;display:flex;gap:.8rem;align-items:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast a{color:var(--brass2);text-decoration:underline}

/* footer */
footer{padding:2.4rem 0 3rem;color:var(--faint);font-size:.78rem;border-top:1px solid var(--line)}
.fnav{display:flex;gap:1.2rem;flex-wrap:wrap;margin:.8rem 0 1rem}
.fnav a{color:var(--dim)}
.fnav a:hover{color:var(--brass2)}
.view{display:none}
.view.on{display:block}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}
@media print{.hd,footer,.toast{display:none}body{background:#fff;color:#111}}
