<style>
:root{--bg:#141C18;--bg2:#1B2620;--panel:#20302A;--panel2:#26372F;--cream:#F3F1E7;--dim:#9FB0A5;--faint:#6E8177;--brass:#C6A65E;--brass2:#E0C583;--line:rgba(198,166,94,.22);--rule:rgba(243,241,231,.1);--err:#C86B5A;--errT:#E8B0A4;

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--cream);font-family:'Inter',sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}

.wrap{max-width:1280px;margin:0 auto;padding:0 clamp(1.1rem,3.5vw,2.6rem)}

h3{font-family:'Fraunces',serif;font-weight:600}
.kick{font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--brass);font-weight:700;margin-bottom:.45rem}
.dek{color:var(--dim);max-width:66ch;font-size:.92rem;margin-top:.55rem}
.center{text-align:center}

/* ---------- ANNOUNCEMENT ---------- */

.ann .wrap{display:flex;align-items:center;justify-content:center;gap:1rem;padding-top:.5rem;padding-bottom:.5rem;position:relative}

.ann-x:hover{color:var(--brass2)}

/* ---------- HEADER ---------- */
.hd{position:sticky;top:0;z-index:40;background:rgba(20,28,24,.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}

.cartbtn:hover{border-color:var(--brass)}
.cartn{background:var(--brass);color:var(--bg);font-weight:700;font-size:.66rem;border-radius:999px;min-width:1.2rem;height:1.2rem;display:inline-flex;align-items:center;justify-content:center;padding:0 .28rem;transition:transform .18s}

/* ---------- BUTTONS ---------- */

/* ---------- COVERS ---------- */
.cov{display:block;flex:none;transition:transform .18s}

.canvas{aspect-ratio:2/2.75;border-radius:3px 7px 7px 3px;position:relative;overflow:hidden;padding:.85rem;display:flex;flex-direction:column;background:linear-gradient(150deg,var(--ca) 0%,var(--cb) 78%);cursor:pointer;box-shadow:0 10px 26px -14px rgba(0,0,0,.55)}

.covcard .meta{padding:.55rem .15rem 0}

.covrow{display:flex;gap:1.05rem;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px .7rem;scrollbar-width:thin}

/* tracks band */
.ways{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:1.3rem}

/* features */

/* testimonials */
.tcards{display:flex;gap:1rem;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:.6rem}
.tcard{flex:none;width:min(420px,86vw);scroll-snap-align:start;background:var(--panel);border:1px solid var(--line);padding:1.45rem;border-radius:4px}
