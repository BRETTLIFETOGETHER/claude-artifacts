<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Generosity Track Library — 251 Series Across Seven Tracks | Generosity Ministry</title>
<meta name="description" content="251 ready-to-teach generosity series across seven tracks — searchable, filterable, and written out as full churchwide campaigns.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#141C18;--bg2:#1B2620;--panel:#20302A;--panel2:#26372F;--cream:#F3F1E7;--dim:#9FB0A5;--faint:#6E8177;--brass:#C6A65E;--brass2:#E0C583;--line:rgba(198,166,94,.22);--rule:rgba(243,241,231,.1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--cream);font-family:'Inter',sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
::selection{background:var(--brass);color:var(--bg)}
.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(1.2rem,4vw,3rem)}

/* masthead */
.mast{border-bottom:1px solid var(--line);padding:clamp(2.6rem,7vw,5rem) 0 clamp(2rem,4vw,3rem)}
.brand{display:flex;justify-content:space-between;align-items:baseline;font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--brass);font-weight:600;border-bottom:1px solid var(--line);padding-bottom:.9rem;margin-bottom:clamp(1.6rem,4vw,2.6rem)}
.brand span:last-child{color:var(--faint)}
h1{font-family:'Fraunces',serif;font-weight:400;font-size:clamp(2.4rem,8vw,5.2rem);line-height:.98;letter-spacing:-.02em}
h1 em{font-style:italic;color:var(--brass2)}
.pitch{margin-top:1.4rem;max-width:64ch;font-size:clamp(1rem,2.4vw,1.15rem);color:var(--dim)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:clamp(1.8rem,4vw,2.6rem)}
.stat{background:var(--bg);padding:1rem 1.1rem}
.stat .v{font-family:'Fraunces',serif;font-size:1.7rem;font-weight:500;line-height:1;color:var(--brass2)}
.stat .k{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:.4rem}

/* nav */
.nav{position:sticky;top:0;z-index:5;background:rgba(20,28,24,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;gap:1.4rem;overflow-x:auto;padding:.85rem 0;font-size:.78rem;letter-spacing:.04em}
.nav a{color:var(--dim);text-decoration:none;white-space:nowrap}
.nav a:hover{color:var(--brass2)}

/* sections */
section{padding:clamp(2.6rem,6vw,4.4rem) 0;border-bottom:1px solid var(--rule);scroll-margin-top:3.4rem}
.sh-head{display:grid;grid-template-columns:auto 1fr;gap:1.4rem;align-items:start;margin-bottom:1.6rem}
.big-n{font-family:'Fraunces',serif;font-size:clamp(2.6rem,7vw,4.2rem);line-height:.8;color:var(--brass);opacity:.5}
h2{font-family:'Fraunces',serif;font-weight:400;font-size:clamp(1.7rem,4.6vw,2.7rem);line-height:1.02;letter-spacing:-.015em}
.kick{font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--brass);font-weight:600;margin-bottom:.4rem}
.dek{color:var(--dim);max-width:66ch;font-size:.92rem;margin-top:.6rem}

/* why + ways */
.why{font-family:'Fraunces',serif;font-size:clamp(1.3rem,3.4vw,1.9rem);line-height:1.28;max-width:30ch;color:var(--cream)}
.why-b{color:var(--dim);font-size:.94rem;max-width:62ch;margin-top:1rem}
.why-grid{display:grid;gap:1.6rem}
@media(min-width:840px){.why-grid{grid-template-columns:1fr 1fr;gap:3rem}}
.ways{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:1.4rem}
@media(min-width:760px){.ways{grid-template-columns:repeat(3,1fr)}}
.way{background:var(--bg);padding:1.4rem}
.way-n{font-family:'Fraunces',serif;color:var(--brass);font-size:.9rem}
.way-t{font-family:'Fraunces',serif;font-size:1.2rem;font-weight:600;margin:.4rem 0 .4rem}
.way-d{font-size:.86rem;color:var(--dim);line-height:1.45}

/* ---------- LIBRARY (interactive) ---------- */
.toolbar{background:var(--panel);border:1px solid var(--line);padding:1.2rem;margin-top:1.4rem}
.search-row{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center}
.search-box{flex:1;min-width:230px;position:relative}
.search-box svg{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);opacity:.55}
.search-box input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--cream);font-family:'Inter',sans-serif;font-size:.92rem;padding:.75rem 1rem .75rem 2.5rem;border-radius:3px;outline:none}
.search-box input::placeholder{color:var(--faint)}
.search-box input:focus{border-color:var(--brass)}
.count{font-family:'Fraunces',serif;font-size:.95rem;color:var(--brass2);white-space:nowrap}
.count b{font-weight:600}
.chiplab{font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);font-weight:700;margin:1rem 0 .45rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{background:var(--bg);border:1px solid var(--rule);color:var(--dim);font-size:.72rem;font-weight:600;letter-spacing:.03em;padding:.38rem .8rem;border-radius:999px;cursor:pointer;transition:.14s;font-family:'Inter',sans-serif}
.chip:hover{border-color:var(--brass);color:var(--brass2)}
.chip.on{background:var(--brass);border-color:var(--brass);color:var(--bg)}
.clear-btn{background:none;border:none;color:var(--faint);font-size:.72rem;font-family:'Inter',sans-serif;cursor:pointer;text-decoration:underline;padding:.38rem .3rem}
.clear-btn:hover{color:var(--brass2)}

/* library results */
.lib{margin-top:1.6rem}
.tk{margin-bottom:2.2rem}
.tk-bar{display:flex;gap:1rem;align-items:baseline;border-bottom:2px solid var(--brass);padding-bottom:.5rem}
.tk-i{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);font-weight:700}
.tk-n{font-family:'Fraunces',serif;font-size:1.3rem;font-weight:600;flex:1}
.tk-c{font-family:'Fraunces',serif;font-size:1.3rem;color:var(--brass);opacity:.7}
.tk-d{font-size:.84rem;color:var(--faint);margin:.5rem 0 .3rem}
.rowset{border-top:1px solid var(--rule)}
.row{display:grid;grid-template-columns:2.4em 1fr auto;gap:0 .8rem;padding:.65rem .4rem;border-bottom:1px solid var(--rule);align-items:baseline;cursor:pointer;transition:background .13s;border-left:2px solid transparent}
.row:hover{background:var(--panel);border-left-color:var(--brass)}
@media(min-width:900px){.row{grid-template-columns:2.6em minmax(200px,1fr) minmax(220px,1.3fr) auto auto}}
.r-n{font-family:'Fraunces',serif;font-size:.76rem;color:var(--brass);opacity:.75}
.r-t{font-family:'Fraunces',serif;font-size:1rem;font-weight:600;letter-spacing:-.005em}
.r-t mark{background:rgba(198,166,94,.32);color:var(--brass2);border-radius:2px;padding:0 .06em}
.r-s{font-size:.82rem;color:var(--dim);grid-column:2}
.r-s mark{background:rgba(198,166,94,.25);color:var(--cream);border-radius:2px;padding:0 .06em}
@media(min-width:900px){.r-s{grid-column:3}}
.r-tags{display:none}
@media(min-width:900px){.r-tags{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:flex-end}}
.mini-tag{font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border:1px solid var(--rule);border-radius:999px;padding:.14rem .5rem;white-space:nowrap}
.r-go{color:var(--brass);font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;justify-self:end}
.row:hover .r-go{color:var(--brass2)}
.noresults{padding:2.4rem 1rem;text-align:center;color:var(--faint);font-size:.92rem;border:1px dashed var(--rule);margin-top:1rem}
.noresults b{color:var(--dim)}

/* ---------- MODAL ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,15,12,.78);backdrop-filter:blur(5px);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:clamp(.8rem,3vw,2.6rem)}
.overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--line);max-width:880px;width:100%;position:relative;animation:rise .28s ease}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.modal{animation:none}}
.m-close{position:absolute;top:.9rem;right:.9rem;background:var(--panel);border:1px solid var(--line);color:var(--dim);width:2.2rem;height:2.2rem;border-radius:999px;cursor:pointer;font-size:1rem;line-height:1;z-index:2}
.m-close:hover{color:var(--brass2);border-color:var(--brass)}
.m-head{padding:clamp(1.6rem,4vw,2.6rem) clamp(1.4rem,4vw,2.8rem) 1.4rem;border-bottom:1px solid var(--line);background:linear-gradient(160deg,var(--panel) 0%,var(--bg2) 70%)}
.m-track{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);font-weight:700}
.m-title{font-family:'Fraunces',serif;font-weight:400;font-size:clamp(1.8rem,5vw,2.9rem);line-height:1.02;letter-spacing:-.015em;margin:.5rem 0 .35rem}
.m-sub{font-family:'Fraunces',serif;font-style:italic;font-size:1.05rem;color:var(--brass2)}
.m-tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.9rem}
.m-body{padding:clamp(1.4rem,4vw,2.4rem) clamp(1.4rem,4vw,2.8rem) clamp(1.8rem,4vw,2.6rem)}
.m-k{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);font-weight:700;margin:1.8rem 0 .6rem}
.m-k:first-child{margin-top:0}
.m-p{color:var(--dim);font-size:.94rem;line-height:1.6;max-width:70ch;margin-bottom:.7rem}
.m-big{font-family:'Fraunces',serif;font-size:clamp(1.15rem,3vw,1.45rem);line-height:1.3;color:var(--cream);border-left:2px solid var(--brass);padding-left:1rem;max-width:56ch}
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.gl{background:var(--bg);padding:.85rem 1rem}
.gl .v{font-family:'Fraunces',serif;font-size:1.02rem;font-weight:600;color:var(--brass2)}
.gl .k{font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:.3rem}
.wk{display:grid;grid-template-columns:3.4rem 1fr;gap:.9rem;padding:.85rem 0;border-bottom:1px solid var(--rule)}
.wk:last-child{border-bottom:none}
.wk-n{font-family:'Fraunces',serif;color:var(--brass);opacity:.65;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;padding-top:.1rem}
.wk-t{font-family:'Fraunces',serif;font-size:1.08rem;font-weight:600;line-height:1.15}
.wk-d{font-size:.85rem;color:var(--dim);margin-top:.2rem;line-height:1.5;max-width:62ch}
.scr{display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
@media(min-width:640px){.scr{grid-template-columns:1fr 1fr}}
.sc{background:var(--panel);padding:.85rem 1rem}
.sc .ref{font-family:'Fraunces',serif;font-weight:600;font-size:.95rem;color:var(--brass2)}
.sc .why{font-family:'Inter',sans-serif;font-size:.78rem;color:var(--dim);max-width:none;margin-top:.2rem;line-height:1.45}
.deploy{list-style:none;display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
@media(min-width:640px){.deploy{grid-template-columns:1fr 1fr}}
.deploy li{background:var(--bg);padding:.8rem 1rem;font-size:.85rem;color:var(--dim);display:flex;gap:.7rem;line-height:1.45}
.deploy li::before{content:"\2713";color:var(--brass);font-weight:700;flex:none}
.steps{counter-reset:st;border-top:1px solid var(--rule)}
.step{display:grid;grid-template-columns:2.4rem 1fr;gap:.9rem;padding:.8rem 0;border-bottom:1px solid var(--rule)}
.step::before{counter-increment:st;content:counter(st,decimal-leading-zero);font-family:'Fraunces',serif;color:var(--brass);opacity:.55;font-size:1.05rem}
.step b{font-family:'Fraunces',serif;font-weight:600;font-size:.98rem;display:block}
.step span{font-size:.83rem;color:var(--dim);line-height:1.5;display:block;margin-top:.15rem;max-width:62ch}
.m-cta{margin-top:2rem;display:flex;gap:.7rem;flex-wrap:wrap}
.btn{border:1px solid var(--brass);color:var(--bg);background:var(--brass);padding:.7rem 1.5rem;border-radius:3px;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;cursor:pointer;font-family:'Inter',sans-serif}
.btn:hover{background:var(--brass2);border-color:var(--brass2)}
.btn.ghost{background:transparent;color:var(--brass2)}
.btn.ghost:hover{border-color:var(--brass2)}

/* book */
.bk{display:grid;gap:2rem;align-items:center;margin:1.4rem 0 2.4rem}
@media(min-width:860px){.bk{grid-template-columns:340px 1fr;gap:3rem}}
.bk-cover{position:relative;width:min(340px,88vw);aspect-ratio:2/2.7;border-radius:3px 7px 7px 3px;background:linear-gradient(135deg,#2C4A38 0%,#20302A 50%,#16211C 100%);box-shadow:0 26px 50px -20px rgba(0,0,0,.75);overflow:hidden}
.bk-cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(0,0,0,0))}
.bk-cover::after{content:"";position:absolute;inset:13px;border:1px solid rgba(198,166,94,.45);border-radius:2px}
.bk-in{position:relative;height:100%;display:flex;flex-direction:column;padding:clamp(1.5rem,4vw,2.2rem)}
.bk-top{font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);font-weight:600}
.bk-lab{margin-top:auto;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:600}
.bk-ti{font-family:'Fraunces',serif;font-weight:400;font-size:clamp(1.6rem,5vw,2rem);line-height:1.02;letter-spacing:-.015em;margin:.45rem 0}
.bk-ti em{font-style:italic;color:var(--brass2)}
.bk-r{width:40px;height:2px;background:var(--brass);margin:.45rem 0 .6rem}
.bk-su{font-size:.8rem;color:var(--dim);line-height:1.4;max-width:30ch}
.bk-f{margin-top:1.1rem;display:flex;justify-content:space-between;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);font-weight:600;border-top:1px solid rgba(198,166,94,.28);padding-top:.6rem}
.bk-k{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);font-weight:600;margin-bottom:.6rem}
.bk-side p{color:var(--dim);font-size:.95rem;max-width:52ch}
.chs{border-top:1px solid var(--rule)}
@media(min-width:900px){.chs{column-count:2;column-gap:3rem}}
.ch{display:grid;grid-template-columns:2.6rem 1fr;gap:.9rem;padding:1rem 0;border-bottom:1px solid var(--rule);break-inside:avoid}
.ch-n{font-family:'Fraunces',serif;font-size:1.15rem;color:var(--brass);opacity:.5;line-height:1.1}
.ch-t{font-family:'Fraunces',serif;font-size:1.1rem;font-weight:600;line-height:1.15}
.ch-s{font-family:'Fraunces',serif;font-style:italic;font-size:.87rem;color:var(--brass2);margin:.1rem 0 .4rem}
.ch-b p{font-size:.84rem;color:var(--dim);line-height:1.5}

/* cta + footer */
.cta{background:var(--panel);border:1px solid var(--line);padding:clamp(1.8rem,5vw,3rem);margin:2.4rem 0;text-align:center}
.cta h2{margin-bottom:.6rem}
.cta p{color:var(--dim);max-width:52ch;margin:0 auto 1.4rem;font-size:.94rem}
.btns{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
footer{padding:2.6rem 0 3.4rem;color:var(--faint);font-size:.78rem;border-top:1px solid var(--line)}
@media print{body{background:#fff;color:#111}.nav{display:none}}
</style>
</head>
<body>
