<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAN Engine Console&trade; &mdash; Profile-Driven Family Stewardship Resources</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0C1D33; --panel:#11253F; --panel2:#152C4B;
  --line:rgba(201,169,78,.24); --hair:rgba(201,169,78,.14);
  --gold:#C9A94E; --gold-lt:#E6CE8C;
  --paper:#EFE9DC; --body:#D6DEE9; --muted:#90A4BD;
  --red:#D98A6A; --green:#8FBF9F;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--navy);
  background-image:radial-gradient(120% 50% at 50% 0%, #142A48 0%, #0C1D33 50%, #07121F 100%);
  background-attachment:fixed;
  color:var(--body);font-family:"Cormorant Garamond",Georgia,serif;font-size:18px;line-height:1.6;
}
.wrap{max-width:800px;margin:0 auto;padding:0 18px}
h1,h2,h3,h4,h5{font-family:"Playfair Display",Georgia,serif;font-weight:500;color:var(--paper);margin:0}
p{margin:0 0 .9em}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.label{font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:600}
.gold{color:var(--gold-lt)}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(9,22,38,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:800px;margin:0 auto;padding:.7rem 18px;display:flex;align-items:center;gap:.7rem}
.brand{font-family:"Playfair Display",serif;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.fam{flex:1;min-width:0;font-family:"Playfair Display",serif;color:var(--paper);font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn{background:none;border:1px solid var(--line);color:var(--gold);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;padding:.35rem .6rem;white-space:nowrap}
.tbtn:hover{border-color:var(--gold)}
.strip{max-width:800px;margin:0 auto;padding:0 18px .6rem;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.seg{display:flex;border:1px solid var(--hair)}
.seg button{background:none;border:0;color:var(--muted);font-size:.58rem;letter-spacing:.13em;text-transform:uppercase;padding:.3rem .5rem}
.seg button.on{background:var(--gold);color:#0C1D33;font-weight:600}
select.tone{background:var(--panel);border:1px solid var(--hair);color:var(--body);font-size:.72rem;padding:.25rem .4rem;font-family:inherit}

/* hero */
.hero{padding:34px 0 26px;text-align:center}
.hero h1{font-size:clamp(2rem,9vw,3.1rem);line-height:1;letter-spacing:-.01em;font-weight:700}
.hero .tm{font-size:.26em;vertical-align:super;color:var(--gold)}
.hero .deck{font-style:italic;color:var(--paper);margin:.9rem auto 0;max-width:34ch;font-size:1.02rem}
.hero .note{color:var(--muted);font-size:.88rem;max-width:42ch;margin:1rem auto 0}

/* sections */
.sec{padding:28px 0;border-top:1px solid var(--line)}
.sechead{margin:0 0 1.1rem}
.sechead h2{font-size:clamp(1.35rem,5.6vw,1.9rem);line-height:1.1}
.sechead .sub{color:var(--muted);font-style:italic;font-size:.98rem;margin:.4rem 0 0}
.back{background:none;border:0;color:var(--gold);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;padding:.2rem 0;margin-bottom:.9rem}

/* metrics */
.mets{display:flex;flex-wrap:wrap;gap:1px;background:var(--hair);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 0 1.2rem}
.mets div{flex:1 1 33%;background:var(--navy);padding:.7rem .3rem;text-align:center}
.mets b{display:block;font-family:"Playfair Display",serif;font-size:1.3rem;color:var(--gold-lt);font-weight:500;line-height:1}
.mets span{display:block;font-size:.54rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-top:.35rem}
.riskpill{display:inline-block;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;padding:.24rem .55rem;border:1px solid currentColor}
.r-HIGH{color:var(--red)} .r-ELEVATED{color:var(--gold)} .r-MODERATE{color:var(--gold-lt)} .r-LOW{color:var(--green)}

/* engine + tool rows */
.row{display:flex;gap:.85rem;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--hair);padding:.95rem 0;color:inherit}
.row:hover .rt{color:var(--gold-lt)}
.rn{font-family:"Playfair Display",serif;color:var(--gold);font-size:1.15rem;min-width:1.6em;line-height:1.3}
.rmain{flex:1;min-width:0}
.rt{display:block;font-family:"Playfair Display",serif;font-size:1.06rem;color:var(--paper);line-height:1.25}
.rs{display:block;font-size:.94rem;color:var(--muted);font-style:italic;margin-top:.18rem;line-height:1.4}
.rmeta{display:block;font-size:.56rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-top:.35rem}
.arw{color:var(--gold);padding-top:.2rem}
.done{color:var(--green);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;padding-top:.35rem}

/* output */

.gate .gl{font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);flex:1}
.out{border:1px solid var(--hair);background:rgba(255,255,255,.02);padding:1.1rem 1.15rem;margin:0 0 1.1rem}
.out h4{font-family:"Playfair Display",serif;color:var(--gold-lt);font-size:1.05rem;margin:1.2rem 0 .45rem;letter-spacing:.01em}
.out h4:first-child{margin-top:0}
.out h5{font-size:.92rem;color:var(--paper);margin:.9rem 0 .3rem;letter-spacing:.06em;text-transform:uppercase}
.out p{font-size:1rem;color:var(--body)}
.out ul{margin:0 0 .9rem;padding-left:1.1rem}
.out li{margin:0 0 .3rem;font-size:1rem}
.out strong{color:var(--paper)}
.out blockquote{margin:0 0 .9rem;padding-left:.9rem;border-left:2px solid var(--gold);font-style:italic;color:var(--paper)}
.acts{display:flex;gap:.5rem;flex-wrap:wrap;margin:0 0 1rem}
.act{background:none;border:1px solid var(--line);color:var(--gold);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;padding:.45rem .75rem}
.act.primary{background:var(--gold);color:#0C1D33;border-color:var(--gold);font-weight:600}
.act:disabled{opacity:.45;cursor:default}
.spin{color:var(--muted);font-style:italic;padding:1.4rem 0;text-align:center}
.dot{display:inline-block;animation:bl 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
.err{border:1px solid var(--red);color:var(--red);padding:.8rem .9rem;margin:0 0 1rem;font-size:.95rem}
.revbox{width:100%;background:var(--panel);border:1px solid var(--hair);color:var(--body);font-family:inherit;font-size:1rem;padding:.7rem;margin:0 0 .6rem}

/* profile form */

.fld label{display:block;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.grid3{display:grid;grid-template-columns:1.4fr .6fr 1fr;gap:.5rem;align-items:end}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin:0 0 1rem}
.chip{border:1px solid var(--hair);color:var(--muted);font-size:.82rem;padding:.28rem .55rem;background:none}
.chip.on{border-color:var(--gold);color:var(--gold-lt);background:rgba(201,169,78,.09)}
.kid{border-bottom:1px solid var(--hair);padding:.7rem 0}
.rm{background:none;border:0;color:var(--red);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase}
.subhead{font-family:"Playfair Display",serif;color:var(--gold-lt);font-size:1.05rem;margin:1.5rem 0 .6rem;border-bottom:1px solid var(--hair);padding-bottom:.3rem}

.foot{text-align:center;padding:36px 0 60px;border-top:1px solid var(--line);margin-top:26px}
.foot p{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0}

@media (min-width:660px){ body{font-size:19px} .mets div{flex:1 1 20%} }
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>

/* ============================ METRICS ============================ */

function computeMetrics(){
  var stages = [Number(PROFILE.g1aStage), Number(PROFILE.g1bStage)];
  var g2 = PROFILE.children.map(function(c){ return Number(c.stage); });
  stages = stages.concat(g2);
  if (Number(PROFILE.grandkids) > 0) { stages.push(Number(PROFILE.g3Stage)); }
  var sum = 0;
  for (var i=0;i<stages.length;i++){ sum += stages[i]; }
  var depth = stages.length ? Math.round((sum / (stages.length * 5)) * 100) : 0;
  var g2known = g2.filter(function(s){ return s >= 3; }).length;
  var g2cov = g2.length ? Math.round((g2known / g2.length) * 100) : 0;
  var spouse = Number(PROFILE.g1bStage) >= 3 ? "Engaged" : "Not engaged";
  var g3cov = Number(PROFILE.grandkids) > 0 ? (Number(PROFILE.g3Stage) >= 3 ? 100 : 0) : 0;

  var drivers = [];
  var pts = 0;
  if (Number(PROFILE.g1aAge) >= 65){ pts++; drivers.push("Primary client is " + PROFILE.g1aAge); }
  if (Number(PROFILE.advisorAge) >= 60){ pts++; drivers.push("Lead advisor is " + PROFILE.advisorAge + " with no stated succession"); }
  if (!PROFILE.secondaryAdvisor){ pts += 1; drivers.push("No secondary advisor relationship in the household"); }
  if (g2cov < 50){ pts += 2; drivers.push("Only " + g2known + " of " + g2.length + " adult children at connected or better"); }
  if (Number(PROFILE.g1bStage) < 3){ pts++; drivers.push("Spouse relationship is below connected"); }
  if (Number(PROFILE.lastMeetingYears) >= 2){ pts++; drivers.push("No family meeting in " + PROFILE.lastMeetingYears + " years"); }
  if (!PROFILE.successionComplete){ pts++; drivers.push("Succession discussion incomplete"); }
  if (Number(PROFILE.grandkids) > 0 && Number(PROFILE.g3Stage) < 2){ pts++; drivers.push("No G3 engagement"); }

  var cls = pts >= 6 ? "HIGH" : (pts >= 4 ? "ELEVATED" : (pts >= 2 ? "MODERATE" : "LOW"));
  return {depth:depth, g2cov:g2cov, g3cov:g3cov, spouse:spouse, g2known:g2known, g2total:g2.length,
          risk:cls, points:pts, drivers:drivers};
}

/* ============================ PROMPT ============================ */

function profileText(){
  var p = PROFILE;
  var s = "FAMILY PROFILE\n";
  s += "Family: The " + p.familyName + " family\n";
  s += "Generation 1: " + p.g1a + " (" + p.g1aAge + ", relationship stage " + STAGES[p.g1aStage] + ") and " + p.g1b + " (" + p.g1bAge + ", relationship stage " + STAGES[p.g1bStage] + ")\n";
  s += "Adult children:\n";
  for (var i=0;i<p.children.length;i++){
    var c = p.children[i];
    s += "  - " + c.name + ", age " + c.age + ", relationship stage " + STAGES[c.stage] + (c.note ? ". " + c.note : "") + "\n";
  }

  }
  if (l === "faith-friendly") {

  }

function buildPrompt(tool, revision){
  var s = "You are an engine inside CAN, a family stewardship and relationship-retention operating system used by advisors at registered investment advisory firms.\n\n";
  s += profileText();

  s += "\n" + langRule() + "\n";
  s += "TONE: " + PROFILE.tone + ".\n";
  s += "AUDIENCE: " + (tool.aud === "Advisor" ? "The advisor. Never shown to the family as written." : (tool.aud === "CEO" ? "The firm's chief executive." : "The family. It will carry the advisor's name and the firm's name."));
  s += "\n\nTASK: Produce " + tool.name.replace(/\u2122/g, "") + ". " + tool.ins + "\n\n";
  s += "RULES\n";
  s += "- Use only the facts in the profile. Where something is unknown, say what should be asked rather than inventing it.\n";
  s += "- Name real family members from the profile. Generic content is a failure.\n";
  s += "- Never give tax, legal, or investment advice. Point to the appropriate specialist instead.\n";
  s += "- Do not discuss specific inheritance amounts with or about the next generation.\n";
  s += "- Output finished text only: no preamble, no explanation of what you are about to do, no closing offer to help.\n";
  s += "- Format in markdown using ## for section headings, - for bullets, and ** ** for emphasis. Under 450 words.\n";
  if (revision) {
    s += "\nADVISOR REVISION INSTRUCTION (this overrides the above where they conflict): " + revision + "\n";
  }
  return s;
}

/* ============================ API ============================ */

async function callClaude(prompt){
  var res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{role: "user", content: prompt}]
    })
  });
  if (!res.ok) { throw new Error("Request failed (" + res.status + ")"); }
  var data = await res.json();
  var out = "";
  for (var i=0;i<data.content.length;i++){
    if (data.content[i].type === "text") { out += data.content[i].text; }
  }
  return out.trim();
}

/* ============================ MARKDOWN ============================ */

function esc(t){
  return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function inline(t){
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>");
  return t;
}
function mdToHtml(src){
  var lines = esc(src).split("\n");
  var html = "";
  var inList = false;
  for (var i=0;i<lines.length;i++){
    var ln = lines[i].replace(/\s+$/,"");
    var t = ln.replace(/^\s+/,"");
    if (t === "") { if (inList){ html += "</ul>"; inList = false; } continue; }
    if (t.indexOf("### ") === 0) {
      if (inList){ html += "</ul>"; inList = false; }
      html += "<h5>" + inline(t.slice(4)) + "</h5>"; continue;
    }
    if (t.indexOf("## ") === 0) {
      if (inList){ html += "</ul>"; inList = false; }
      html += "<h4>" + inline(t.slice(3)) + "</h4>"; continue;
    }
    if (t.indexOf("# ") === 0) {
      if (inList){ html += "</ul>"; inList = false; }
      html += "<h4>" + inline(t.slice(2)) + "</h4>"; continue;
    }
    if (t.indexOf("&gt; ") === 0) {
      if (inList){ html += "</ul>"; inList = false; }
      html += "<blockquote>" + inline(t.slice(5)) + "</blockquote>"; continue;
    }
    if (t.indexOf("- ") === 0 || t.indexOf("* ") === 0) {
      if (!inList){ html += "<ul>"; inList = true; }
      html += "<li>" + inline(t.slice(2)) + "</li>"; continue;
    }
    var num = t.match(/^(\d+)\.\s+(.*)$/);
    if (num) {
      if (!inList){ html += "<ul>"; inList = true; }
      html += "<li><strong>" + num[1] + ".</strong> " + inline(num[2]) + "</li>"; continue;
    }
    if (inList){ html += "</ul>"; inList = false; }
    html += "<p>" + inline(t) + "</p>";
  }
  if (inList){ html += "</ul>"; }
  return html;
}

/* ============================ STORAGE ============================ */

async function saveProfile(){
  try {
    if (typeof window.storage !== "undefined" && window.storage) {
      await window.storage.set("can:profile", JSON.stringify(PROFILE));
    }
  } catch (err) { /* storage unavailable; session only */ }
}
async function loadProfile(){
  try {
    if (typeof window.storage !== "undefined" && window.storage) {
      var r = await window.storage.get("can:profile");
      if (r && r.value) {
        var saved = JSON.parse(r.value);
        for (var k in saved) { if (Object.prototype.hasOwnProperty.call(saved, k)) { PROFILE[k] = saved[k]; } }
      }
    }
  } catch (err) { /* first run or unavailable */ }
}

  } catch (err) {
    zone.innerHTML = '<div class="err">Could not reach the generation service. ' + esc(String(err.message || err)) +
      '<br><br>This console generates live text through Claude, so it needs to run inside the Claude app rather than a saved local copy.</div>' +
      '<div class="acts"><button class="act primary" data-gen="' + id + '" type="button">Try again</button></div>';

/* ============================ EVENTS ============================ */

document.addEventListener("click", function(e){
  var el = e.target.closest ? e.target.closest("[data-go],[data-engine],[data-tool],[data-gen],[data-copy],[data-revise],[data-chip],[data-addkid],[data-rmkid],[data-lang]") : null;
  if (!el) { return; }

  if (el.hasAttribute("data-lang")) {
    PROFILE.faithLanguage = el.getAttribute("data-lang");
    saveProfile(); render(); return;
  }
  if (el.hasAttribute("data-go")) {
    var g = el.getAttribute("data-go");
    if (g === "engines") { VIEW = {name:"engines"}; saveProfile(); }
    else if (g === "profile") { VIEW = {name:"profile"}; }
    else if (g.indexOf("engine:") === 0) { VIEW = {name:"engine", engine:g.split(":")[1]}; }
    render(); return;
  }
  if (el.hasAttribute("data-engine")) { VIEW = {name:"engine", engine:el.getAttribute("data-engine")}; render(); return; }
  if (el.hasAttribute("data-tool")) { var tid = el.getAttribute("data-tool"); VIEW = {name:"tool", engine:toolById(tid).e, tool:tid}; render(); return; }
  if (el.hasAttribute("data-gen")) { generate(el.getAttribute("data-gen"), null); return; }

  if (el.hasAttribute("data-copy")) {
    var txt = CACHE[el.getAttribute("data-copy")] || "";
    if (navigator.clipboard) { navigator.clipboard.writeText(txt); }
    el.innerHTML = "Copied";
    setTimeout(function(){ el.innerHTML = "Copy"; }, 1400);
    return;
  }
  if (el.hasAttribute("data-revise")) {
    var rid = el.getAttribute("data-revise");
    var zone = document.getElementById("outzone");
    var box = document.createElement("div");
    box.innerHTML = '<textarea class="revbox" id="revText" rows="3" placeholder="What should change? For example: soften the section addressed to Lauren, or make this one page shorter."></textarea>' +
                    '<div class="acts"><button class="act primary" id="revGo" type="button">Regenerate with this note</button></div>';
    zone.insertBefore(box, zone.firstChild);
    document.getElementById("revText").focus();
    document.getElementById("revGo").addEventListener("click", function(){
      generate(rid, document.getElementById("revText").value);
    });
    return;
  }
  if (el.hasAttribute("data-chip")) {
    var group = el.getAttribute("data-chip");
    var val = el.getAttribute("data-val");
    var arr = PROFILE[group];
    var ix = arr.indexOf(val);
    if (ix > -1) { arr.splice(ix, 1); } else { arr.push(val); }
    saveProfile(); render(); return;
  }
  if (el.hasAttribute("data-addkid")) {
    PROFILE.children.push({name:"New child", age:30, stage:0, note:""});
    saveProfile(); render(); return;
  }
  if (el.hasAttribute("data-rmkid")) {
    PROFILE.children.splice(Number(el.getAttribute("data-rmkid")), 1);
    saveProfile(); render(); return;
  }
});

function applyField(el){
  if (el.hasAttribute("data-f")) {
    var f = el.getAttribute("data-f");
    var v = el.value;
    if (f === "daf" || f === "secondaryAdvisor" || f === "successionComplete") { PROFILE[f] = (v === "yes"); }
    else { PROFILE[f] = v; }
    saveProfile();
    if (f === "familyName") { document.getElementById("famLabel").innerHTML = "The " + v + " family"; }
    return true;
  }
  if (el.hasAttribute("data-kid")) {
    PROFILE.children[Number(el.getAttribute("data-kid"))][el.getAttribute("data-k")] = el.value;
    saveProfile();
    return true;
  }
  return false;
}

document.addEventListener("change", function(e){
  var el = e.target;
  if (el.id === "toneSel") { PROFILE.tone = el.value; saveProfile(); return; }
  if (applyField(el)) {
    if (el.tagName === "SELECT" && VIEW.name === "profile") { render(); }
  }
});
document.addEventListener("input", function(e){ applyField(e.target); });

/* ============================ BOOT ============================ */

(async function(){
  await loadProfile();
  render();
})();
</script>
</body>
</html>
