<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAN Professional Edition&trade;</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--navy:#0C1D33;--panel:#11253F;--line:rgba(201,169,78,.24);--hair:rgba(201,169,78,.14);
 --gold:#C9A94E;--gold-lt:#E6CE8C;--paper:#EFE9DC;--body:#D6DEE9;--muted:#90A4BD;--red:#D98A6A;--green:#8FBF9F}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--navy);background-image:radial-gradient(120% 50% at 50% 0%,#142A48 0%,#0C1D33 50%,#07121F 100%);
 background-attachment:fixed;color:var(--body);font-family:"Cormorant Garamond",Georgia,serif;font-size:18px;line-height:1.6}
.wrap{max-width:800px;margin:0 auto;padding:0 18px}
h1,h2,h3,h4,h5{font-family:"Playfair Display",Georgia,serif;font-weight:500;color:var(--paper);margin:0}
p{margin:0 0 .9em}
button{font:inherit;cursor:pointer}
a{color:var(--gold-lt)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.label{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
.top{position:sticky;top:0;z-index:20;background:rgba(9,22,38,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:800px;margin:0 auto;padding:.55rem 18px;display:flex;align-items:center;gap:.6rem}
.brand{font-family:"Playfair Display",serif;font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.crumb{flex:1;min-width:0;font-size:.78rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;border:1px solid var(--hair)}
.seg button{background:none;border:0;color:var(--muted);font-size:.53rem;letter-spacing:.11em;text-transform:uppercase;padding:.28rem .42rem}
.seg button.on{background:var(--gold);color:#0C1D33;font-weight:600}
.tabs{max-width:800px;margin:0 auto;padding:0 18px;display:flex;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
 font-family:"Playfair Display",serif;font-size:.85rem;padding:.5rem .65rem;white-space:nowrap}
.tabs button.on{color:var(--gold-lt);border-bottom-color:var(--gold)}
.sec{padding:24px 0;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.sechead{margin:0 0 1rem}
.sechead h2{font-size:clamp(1.3rem,5.4vw,1.85rem);line-height:1.12}
.sechead .sub{color:var(--muted);font-style:italic;font-size:.97rem;margin:.35rem 0 0}
.back{background:none;border:0;color:var(--gold);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;padding:.2rem 0;margin-bottom:.8rem}
.subhead{font-family:"Playfair Display",serif;color:var(--gold-lt);font-size:.98rem;margin:1.4rem 0 .35rem;border-bottom:1px solid var(--hair);padding-bottom:.25rem}
.band{display:flex;flex-wrap:wrap;gap:1px;background:var(--hair);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 0 1.1rem}
.band div{flex:1 1 33%;background:var(--navy);padding:.7rem .3rem;text-align:center}
.band b{display:block;font-family:"Playfair Display",serif;font-size:1.3rem;color:var(--gold-lt);font-weight:500;line-height:1}
.band span{display:block;font-size:.53rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:.32rem}
.row{display:flex;gap:.8rem;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--hair);padding:.8rem 0;color:inherit}
.row:hover .rt{color:var(--gold-lt)}
.rn{font-family:"Playfair Display",serif;color:var(--gold);font-size:.92rem;min-width:2.1em;line-height:1.5}
.rmain{flex:1;min-width:0}
.rt{display:block;font-family:"Playfair Display",serif;font-size:1.02rem;color:var(--paper);line-height:1.25}
.rs{display:block;font-size:.92rem;color:var(--muted);font-style:italic;margin-top:.15rem;line-height:1.4}
.rmeta{display:block;font-size:.54rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-top:.28rem}
.arw{color:var(--gold);padding-top:.15rem}
.tag{display:inline-block;font-size:.49rem;letter-spacing:.13em;text-transform:uppercase;border:1px solid var(--hair);color:var(--muted);padding:.08rem .28rem;margin-left:.32rem;vertical-align:middle}
.panel{border:1px solid var(--line);background:var(--panel);padding:1rem 1.05rem;margin:0 0 1rem}
.panel h4{font-size:1.05rem;color:var(--gold-lt);margin:0 0 .45rem}
.panel ul{margin:0;padding-left:1.05rem}
.panel li{margin:0 0 .25rem;font-size:.98rem}
.gate{border:1px solid var(--line);background:var(--panel);padding:.55rem .75rem;margin:0 0 .9rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.gate .gl{font-size:.54rem;letter-spacing:.19em;text-transform:uppercase;color:var(--gold);flex:1}
.out{border:1px solid var(--hair);background:rgba(255,255,255,.02);padding:1rem 1.05rem;margin:0 0 1rem}
.out h4{font-family:"Playfair Display",serif;color:var(--gold-lt);font-size:1.02rem;margin:1.1rem 0 .4rem}
.out h4:first-child{margin-top:0}
.out h5{font-size:.87rem;color:var(--paper);margin:.8rem 0 .25rem;letter-spacing:.05em;text-transform:uppercase}
.out ul{margin:0 0 .8rem;padding-left:1.1rem}
.out li{margin:0 0 .26rem}
.out strong{color:var(--paper)}
.acts{display:flex;gap:.45rem;flex-wrap:wrap;margin:0 0 .9rem}
.act{background:none;border:1px solid var(--line);color:var(--gold);font-size:.57rem;letter-spacing:.15em;text-transform:uppercase;padding:.42rem .7rem}
.act.primary{background:var(--gold);color:#0C1D33;border-color:var(--gold);font-weight:600}
.spin{color:var(--muted);font-style:italic;padding:1.2rem 0;text-align:center}
.dot{display:inline-block;animation:bl 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
.err{border:1px solid var(--red);color:var(--red);padding:.7rem .8rem;margin:0 0 .9rem;font-size:.94rem}
.fld{margin:0 0 .8rem}
.fld label{display:block;font-size:.58rem;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);margin-bottom:.28rem}
.fld input,.fld select,.fld textarea{width:100%;background:var(--panel);border:1px solid var(--hair);color:var(--paper);font-family:inherit;font-size:1rem;padding:.5rem .6rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.grid3{display:grid;grid-template-columns:1.4fr .6fr 1fr;gap:.45rem;align-items:end}
.kid{border-bottom:1px solid var(--hair);padding:.65rem 0}
.rm{background:none;border:0;color:var(--red);font-size:.57rem;letter-spacing:.13em;text-transform:uppercase}
/* matters sliders */
.mrow{border-bottom:1px solid var(--hair);padding:.75rem 0}
.mtop{display:flex;gap:.6rem;align-items:baseline}
.mname{flex:1;font-family:"Playfair Display",serif;font-size:1rem;color:var(--paper)}
.mq{font-size:.92rem;color:var(--muted);font-style:italic;margin:.1rem 0 .45rem}
.sl{display:flex;align-items:center;gap:.5rem;margin:.25rem 0}
.sl span{font-size:.55rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);min-width:4.6em}
.sl input{flex:1;accent-color:var(--gold)}
.sl b{font-family:"Playfair Display",serif;color:var(--gold-lt);min-width:1.2em;text-align:right;font-weight:500}
.verdict{display:inline-block;font-size:.55rem;letter-spacing:.15em;text-transform:uppercase;padding:.16rem .45rem;border:1px solid currentColor}
.v-act{color:var(--red)} .v-prep{color:var(--gold)} .v-watch{color:var(--muted)} .v-hold{color:var(--green)}
/* calendar */
.ev{border-bottom:1px solid var(--hair);padding:.7rem 0;display:flex;gap:.75rem;align-items:flex-start}
.evd{font-family:"Playfair Display",serif;color:var(--gold);font-size:.8rem;min-width:5.2em;line-height:1.35}
.evm{flex:1;min-width:0}
.evt{font-family:"Playfair Display",serif;font-size:1rem;color:var(--paper)}
.evs{font-size:.88rem;color:var(--muted);font-style:italic}
.foot{text-align:center;padding:30px 0 54px;border-top:1px solid var(--line);margin-top:20px}
.foot p{font-size:.58rem;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);margin:0}
@media (min-width:660px){body{font-size:19px}.band div{flex:1 1 16%}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</head>
<body>
<div class="top">
  <div class="topin">
    <span class="brand">CAN</span>
    <span class="crumb" id="crumb">Professional Edition</span>
    <span class="seg" id="langSeg">
      <button type="button" data-lang="faith-forward">Forward</button>
      <button type="button" data-lang="faith-friendly">Friendly</button>
      <button type="button" data-lang="values-based">Values</button>
    </span>
  </div>
  <div class="tabs" id="tabs">
    <button type="button" data-tab="role">Who You Are</button>
    <button type="button" data-tab="matters">What Matters</button>
    <button type="button" data-tab="profiles">Profiles</button>
    <button type="button" data-tab="calendar">Calendar</button>
    <button type="button" data-tab="family">Family</button>
  </div>
</div>
<div id="app"></div>
<footer class="foot"><div class="wrap"><p>CAN Professional Edition &middot; AI recommends. The professional approves.</p></div></footer>

<script>
var ROLES = /*__ROLES__*/;
var ASSESSMENTS = /*__ASSESSMENTS__*/;
var MATTERS = /*__MATTERS__*/;
var RHYTHM = /*__RHYTHM__*/;
var CATLIST = /*__CATLIST__*/;
var STATS = /*__STATS__*/;

var STAGES = ["Unknown","Identified","Introduced","Connected","Engaged","Trusted"];
var PROFILE = {
  familyName:"Anderson", g1a:"John", g1aAge:67, g1aStage:5, g1b:"Susan", g1bAge:65, g1bStage:4,
  netWorth:"$22M estimated family net worth",
  business:"Family manufacturing business; eldest son expected to enter leadership",
  faithNote:"Strong Christian faith orientation; long-time church members",
  faithLanguage:"faith-forward", tone:"reflective",
  children:[{name:"Michael",age:38,stage:3,note:"Expected business successor"},
            {name:"Lauren",age:35,stage:1,note:"Disconnected from family financial discussions"},
            {name:"David",age:31,stage:2,note:"Spouse cautious about inherited wealth"}],
  grandkids:4, g3Stage:0,
  advisor:"Dana Whitfield", advisorAge:63, firm:"Smith Wealth Partners"
};
var ROLE = "r1";
var SCORES = {};   // matters id -> {m:1-5, r:1-5}
var ASSESS = {};   // "person::assessmentId" -> result text
var CUSTOM = [];   // {person, name, result}
var EVENTS = [];
var CACHE = {};
var VIEW = {tab:"role", id:null};
var PERSON = "";
var NEWEV = {title:"", date:"", time:"18:00", mins:90, type:"meeting", link:"", who:""};

function roleById(id){ for (var i=0;i<ROLES.length;i++){ if (ROLES[i].id === id){ return ROLES[i]; } } return ROLES[0]; }
function matById(id){ for (var i=0;i<MATTERS.length;i++){ if (MATTERS[i].id === id){ return MATTERS[i]; } } return null; }
function people(){
  var p = PROFILE, out = [p.g1a, p.g1b];
  for (var i=0;i<p.children.length;i++){ out.push(p.children[i].name); }
  if (Number(p.grandkids) > 0){ out.push("Grandchildren"); }
  out.push(p.advisor + " (professional)");
  return out;
}
function score(id){ return SCORES[id] || {m:3, r:3}; }
function verdict(id){
  var s = score(id), gap = Number(s.m) - Number(s.r);
  if (gap >= 2){ return {k:"act", t:"Act now"}; }
  if (gap === 1){ return {k:"prep", t:"Prepare"}; }
  if (gap === 0){ return {k:"watch", t:"Watch"}; }
  return {k:"hold", t:"Maintain"};
}
function rankedMatters(){
  var arr = MATTERS.slice();
  arr.sort(function(a,b){
    var sa = score(a.id), sb = score(b.id);
    return ((Number(sb.m) - Number(sb.r)) * 10 + Number(sb.m)) - ((Number(sa.m) - Number(sa.r)) * 10 + Number(sa.m));
  });
  return arr;
}

/* ---------- prompts ---------- */
function langRule(){
  if (PROFILE.faithLanguage === "faith-forward"){ return "FAITH LANGUAGE: Faith-forward. Explicit Christian framing is welcome, and at most one short NIV verse where it genuinely fits."; }
  if (PROFILE.faithLanguage === "faith-friendly"){ return "FAITH LANGUAGE: Faith-friendly. Acknowledge that faith and values shape decisions, but quote no Scripture."; }
  return "FAITH LANGUAGE: Values-based. Use no religious language. Speak in values, purpose, character, and responsibility.";
}
function profileText(){
  var p = PROFILE, s = "FAMILY PROFILE\nFamily: The " + p.familyName + " family\n";
  s += "Generation 1: " + p.g1a + " (" + p.g1aAge + ", " + STAGES[p.g1aStage] + ") and " + p.g1b + " (" + p.g1bAge + ", " + STAGES[p.g1bStage] + ")\nAdult children:\n";
  for (var i=0;i<p.children.length;i++){
    var c = p.children[i];
    s += "  - " + c.name + ", " + c.age + ", " + STAGES[c.stage] + (c.note ? ". " + c.note : "") + "\n";
  }
  s += "Grandchildren: " + p.grandkids + "\nWealth: " + p.netWorth + "\nBusiness: " + p.business + "\nFaith: " + p.faithNote + "\n";
  s += "Professional: " + p.advisor + ", " + p.firm + "\n";
  return s;
}
function roleText(){
  var r = roleById(ROLE);
  return "\nWHO IS USING THIS: " + r.name + ". Accountable for: " + r.promise +
    " Their recurring themes: " + r.themes.join("; ") + ".\n" +
    "Write everything from this professional's seat. Stay inside their lane, and name the other professional when the question belongs to someone else.\n";
}
var RULES = "\nRULES\n- Use only the facts given; where something is unknown, say what to ask rather than inventing it.\n- Name real family members. Generic content is a failure.\n- Never give tax, legal, or investment advice; name the specialist instead.\n- Do not discuss specific inheritance amounts with the next generation.\n- Finished text only: no preamble, no closing offer to help.\n- Markdown with ## headings and - bullets. Under 450 words.\n";
function head(){
  return "You are an engine inside CAN, a family stewardship operating system used by the professionals who serve wealthy families.\n\n" +
    profileText() + roleText() + "\n" + langRule() + "\nTONE: " + PROFILE.tone + ".\n";
}
function promptRoleAgenda(){
  var r = roleById(ROLE);
  return head() + "\nTASK: Build this professional's working set for this family. Headings: ## Your Ten Questions (numbered, in the order you would ask them, written from the " + r.name +
    " seat), ## Your Meeting Agenda (five items with timings for a ninety-minute meeting), ## What Belongs to Someone Else (the questions this family needs answered that another professional should own, each naming the profession), ## What You Bring That Nobody Else Does." + RULES;
}
function promptMatter(m){
  var s = score(m.id), v = verdict(m.id);
  var out = head() + "\nCATEGORY: " + m.name + "\nTHE QUESTION FAMILIES ARE REALLY ASKING: " + m.q +
    "\nCOMMON SIGNALS: " + m.signals.join("; ") +
    "\nTHIS FAMILY RATED IT: how much it matters " + s.m + " of 5; how ready they are " + s.r + " of 5. System verdict: " + v.t + ".\n";
  out += "\nTHE 225-JOURNEY LIBRARY (recommend only from these exact titles)\n";
  for (var i=0;i<CATLIST.length;i++){ out += CATLIST[i].name + ": " + CATLIST[i].titles.join("; ") + "\n"; }
  out += "\nTASK: Help this family discern their next step in this category. Headings: ## Five Questions to Sit With (numbered, specific to this family), ## What Their Answers Will Reveal, ## The Next Step (one concrete move, with who does it and by when), ## Recommended Journey (one exact title from the library, and one sentence on why), ## Who Else Should Be in the Room." + RULES;
  return out;
}
function assessText(){
  var s = "", any = false, i, j, ppl = people();
  for (i=0;i<ppl.length;i++){
    var line = [];
    for (j=0;j<ASSESSMENTS.length;j++){
      var v = ASSESS[ppl[i] + "::" + ASSESSMENTS[j].id];
      if (v && v.replace(/\s/g,"")){ line.push(ASSESSMENTS[j].name + ": " + v); }
    }
    for (j=0;j<CUSTOM.length;j++){
      if (CUSTOM[j].person === ppl[i] && CUSTOM[j].result){ line.push(CUSTOM[j].name + ": " + CUSTOM[j].result); }
    }
    if (line.length){ any = true; s += "  - " + ppl[i] + " => " + line.join(" | ") + "\n"; }
  }
  return any ? s : "";
}
function promptReadTheRoom(){
  return head() + "\nSELF-REPORTED PROFILE RESULTS ENTERED BY THE FAMILY\n" + assessText() +
    "\nTASK: Turn these into practical guidance for running the family's conversations. Headings: ## How Each Person Is Likely to Show Up, ## Where Friction Will Appear, ## How to Run the Family Meeting Differently, ## Who Needs the Material in Advance, ## What Not to Read Into This.\n" +
    "These are self-reported preference instruments, not clinical assessments. Use them to shape how the conversation is run, never to explain or label a person. Say so plainly in the last section." + RULES;
}
function promptComms(ev){
  return head() + "\nEVENT: " + ev.title + "\nWHEN: " + ev.date + " at " + ev.time + " for " + ev.mins + " minutes\nFORMAT: " + ev.type +
    (ev.link ? "\nLINK: " + ev.link : "") + "\nATTENDEES: " + (ev.who || "the family") +
    "\n\nTASK: Write the communications set for this event. Headings: ## The Invitation (an email from the professional, under 150 words, warm enough that a disengaged adult child would still come), ## The Agenda (four items with timings), ## Reminder at Two Weeks, ## Reminder at Three Days, ## The Follow-Up the Next Day. Keep each reminder under 60 words." + RULES;
}

/* ---------- api + md ---------- */
async function callClaude(prompt){
  var res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({model:"claude-sonnet-4-6", max_tokens:1000, messages:[{role:"user", content:prompt}]})
  });
  if (!res.ok){ throw new Error("Request failed (" + res.status + ")"); }
  var d = await res.json(), out = "";
  for (var i=0;i<d.content.length;i++){ if (d.content[i].type === "text"){ out += d.content[i].text; } }
  return out.trim();
}
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function inline(t){
  t = t.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  return t.replace(/(^|[^*])\*([^*]+)\*/g,"$1<em>$2</em>");
}
function mdToHtml(src){
  var lines = esc(src).split("\n"), html = "", inL = false;
  for (var i=0;i<lines.length;i++){
    var t = lines[i].replace(/^\s+|\s+$/g,"");
    if (t === ""){ if (inL){ html += "</ul>"; inL = false; } continue; }
    if (t.indexOf("### ") === 0){ if (inL){ html += "</ul>"; inL=false; } html += "<h5>" + inline(t.slice(4)) + "</h5>"; continue; }
    if (t.indexOf("## ") === 0){ if (inL){ html += "</ul>"; inL=false; } html += "<h4>" + inline(t.slice(3)) + "</h4>"; continue; }
    if (t.indexOf("- ") === 0 || t.indexOf("* ") === 0){ if (!inL){ html += "<ul>"; inL=true; } html += "<li>" + inline(t.slice(2)) + "</li>"; continue; }
    var n = t.match(/^(\d+)\.\s+(.*)$/);
    if (n){ if (!inL){ html += "<ul>"; inL=true; } html += "<li><strong>" + n[1] + ".</strong> " + inline(n[2]) + "</li>"; continue; }
    if (inL){ html += "</ul>"; inL = false; }
    html += "<p>" + inline(t) + "</p>";
  }
  if (inL){ html += "</ul>"; }
  return html;
}
function genBlock(key, lbl, action){
  if (CACHE[key]){
    return '<div class="acts"><button class="act" data-gen="' + action + '" type="button">Regenerate</button>' +
      '<button class="act" data-copy="' + key + '" type="button">Copy</button></div><div class="out">' + mdToHtml(CACHE[key]) + '</div>';
  }
  return '<div class="acts"><button class="act primary" data-gen="' + action + '" type="button">' + lbl + '</button></div>';
}

/* ---------- storage ---------- */
async function save(){
  try {
    if (typeof window.storage !== "undefined" && window.storage){
      await window.storage.set("can:profile", JSON.stringify(PROFILE));
      await window.storage.set("can:pro", JSON.stringify({role:ROLE, scores:SCORES, assess:ASSESS, custom:CUSTOM, events:EVENTS}));
    }
  } catch (e){}
}
async function load(){
  try {
    if (typeof window.storage !== "undefined" && window.storage){
      var a = await window.storage.get("can:profile");
      if (a && a.value){ var p = JSON.parse(a.value); for (var k in p){ if (Object.prototype.hasOwnProperty.call(p,k)){ PROFILE[k] = p[k]; } } }
    }
  } catch (e){}
  try {
    if (typeof window.storage !== "undefined" && window.storage){
      var b = await window.storage.get("can:pro");
      if (b && b.value){
        var s = JSON.parse(b.value);
        ROLE = s.role || ROLE; SCORES = s.scores || {}; ASSESS = s.assess || {};
        CUSTOM = s.custom || []; EVENTS = s.events || [];
      }
    }
  } catch (e){}
}

/* ---------- views ---------- */
function renderRole(){
  var r = roleById(ROLE);
  var h = '<div class="wrap"><div class="sec"><div class="sechead"><h2>Who is using this</h2>' +
    '<p class="sub">' + STATS.roles + ' professional types. The questions, agenda, and lane change with the choice.</p></div>';
  h += '<div class="panel"><h4>' + r.name + '</h4><p style="margin:0 0 .5rem">' + r.promise + '</p><ul>';
  for (var t=0;t<r.themes.length;t++){ h += '<li>' + r.themes[t] + '</li>'; }
  h += '</ul></div>';
  h += '<div class="gate"><span class="gl">Serving the ' + PROFILE.familyName + ' family</span><span class="label">' + PROFILE.faithLanguage + '</span></div>';
  h += genBlock("agenda:" + ROLE, "Build my questions and agenda", "agenda");
  h += '<div class="subhead">Change seat</div>';
  for (var i=0;i<ROLES.length;i++){
    var x = ROLES[i];
    h += '<button class="row" type="button" data-role="' + x.id + '">' +
      '<span class="rn">' + (x.n < 10 ? "0" : "") + x.n + '</span>' +
      '<span class="rmain"><span class="rt">' + x.name + (x.id === ROLE ? '<span class="tag">current</span>' : (x.src === 0 ? '<span class="tag">added</span>' : '')) + '</span>' +
      '<span class="rs">' + x.promise + '</span></span><span class="arw">&rsaquo;</span></button>';
  }
  return h + '</div></div>';
}

function renderMatters(){

    var m = ranked[i], s = score(m.id), v = verdict(m.id);
    h += '<div class="mrow"><div class="mtop"><span class="mname">' + m.name + '</span>' +
      '<span class="verdict v-' + v.k + '">' + v.t + '</span></div>' +
      '<div class="mq">' + m.q + '</div>' +
      '<div class="sl"><span>Matters</span><input type="range" min="1" max="5" value="' + s.m + '" data-sc="' + m.id + ':m"><b>' + s.m + '</b></div>' +
      '<div class="sl"><span>Ready</span><input type="range" min="1" max="5" value="' + s.r + '" data-sc="' + m.id + ':r"><b>' + s.r + '</b></div>' +

function renderMatter(id){
  var m = matById(id), s = score(id), v = verdict(id);

function renderProfiles(){

  h += '</select></div>';
  for (var j=0;j<ASSESSMENTS.length;j++){
    var a = ASSESSMENTS[j], key = PERSON + "::" + a.id, val = ASSESS[key] || "";
    h += '<div class="fld"><label>' + a.name + '</label>' +
      '<input data-as="' + key + '" value="' + esc(val) + '" placeholder="' + a.hint + '">' +
      '<div style="font-size:.85rem;color:var(--muted);margin-top:.2rem">' + a.desc +
      (val ? '' : ' &middot; <a href="' + a.url + '" target="_blank" rel="noopener">take it</a>') + '</div></div>';

  h += '<div class="subhead">New or other</div>';
  for (var k=0;k<CUSTOM.length;k++){
    if (CUSTOM[k].person !== PERSON){ continue; }
    h += '<div class="kid"><div class="grid2">' +
      '<div class="fld" style="margin:0"><label>Assessment</label><input data-cu="' + k + ':name" value="' + esc(CUSTOM[k].name) + '"></div>' +
      '<div class="fld" style="margin:0"><label>Result</label><input data-cu="' + k + ':result" value="' + esc(CUSTOM[k].result) + '"></div></div>' +
      '<button class="rm" type="button" data-rmcu="' + k + '">Remove</button></div>';

    h += '<p style="color:var(--muted)">Enter at least one result above, for anyone, and this will translate the whole set into how to run the family conversation.</p>';

function renderCalendar(){
  var h = '<div class="wrap"><div class="sec"><div class="sechead"><h2>Master family calendar</h2>' +
    '<p class="sub">The annual rhythm, plus anything you add. Export to any calendar, and write the emails from here.</p></div>';
  if (!EVENTS.length){
    h += '<div class="panel"><h4>Start with the annual rhythm</h4><ul>';
    for (var r=0;r<RHYTHM.length;r++){ h += '<li>' + RHYTHM[r][0] + ' &mdash; ' + RHYTHM[r][3] + '</li>'; }
    h += '</ul></div><div class="acts"><button class="act primary" data-seed="1" type="button">Load the annual rhythm</button></div>';
  }
  h += '<div class="subhead">Add an event</div>';
  h += '<div class="fld"><label>Title</label><input data-ne="title" value="' + esc(NEWEV.title) + '" placeholder="Anderson family meeting"></div>' +
    '<div class="grid3"><div class="fld" style="margin:0"><label>Date</label><input data-ne="date" type="date" value="' + NEWEV.date + '"></div>' +
    '<div class="fld" style="margin:0"><label>Time</label><input data-ne="time" type="time" value="' + NEWEV.time + '"></div>' +
    '<div class="fld" style="margin:0"><label>Minutes</label><input data-ne="mins" value="' + NEWEV.mins + '"></div></div>';
  h += '<div class="grid2" style="margin-top:.55rem"><div class="fld"><label>Format</label><select data-ne="type">' +
    ["meeting","zoom","call","review","reminder"].map(function(t){ return '<option value="' + t + '"' + (NEWEV.type === t ? ' selected' : '') + '>' + t + '</option>'; }).join("") +
    '</select></div><div class="fld"><label>Zoom or location</label><input data-ne="link" value="' + esc(NEWEV.link) + '" placeholder="https://zoom.us/j/..."></div></div>';
  h += '<div class="fld"><label>Attendees</label><input data-ne="who" value="' + esc(NEWEV.who) + '" placeholder="' + people().slice(0,4).join(", ") + '"></div>';
  h += '<div class="acts"><button class="act primary" data-addev="1" type="button">Add to the calendar</button>' +
    (EVENTS.length ? '<button class="act" data-ics="1" type="button">Export .ics</button>' : '') + '</div>';

  if (EVENTS.length){
    h += '<div class="subhead">Scheduled</div>';
    var sorted = EVENTS.slice().sort(function(a,b){ return (a.date + a.time) < (b.date + b.time) ? -1 : 1; });
    for (var i=0;i<sorted.length;i++){
      var e = sorted[i], ix = EVENTS.indexOf(e);
      h += '<div class="ev"><span class="evd">' + (e.date || "unscheduled") + '<br>' + (e.time || "") + '</span>' +
        '<span class="evm"><span class="evt">' + e.title + '</span>' +
        '<span class="evs">' + e.type + ' &middot; ' + e.mins + ' min' + (e.who ? ' &middot; ' + e.who : '') + '</span>' +
        (e.link ? '<span class="evs">' + e.link + '</span>' : '') +
        '<div class="acts" style="margin:.4rem 0 0"><button class="act" data-comms="' + ix + '" type="button">Emails &amp; agenda</button>' +
        '<button class="rm" data-rmev="' + ix + '" type="button">Remove</button></div>' +
        (CACHE["ev:" + ix] ? '<div class="out">' + mdToHtml(CACHE["ev:" + ix]) + '</div>' : '') +
        '</span></div>';
    }
  }
  return h + '</div></div>';
}

  h += '<div class="grid2" style="margin-top:1rem"><div class="fld"><label>Grandchildren</label><input data-f="grandkids" value="' + p.grandkids + '"></div>' +

      return '<option value="' + t + '"' + (p.tone === t ? ' selected' : '') + '>' + t + '</option>'; }).join("") + '</select></div></div>';
  h += '<div class="fld"><label>Wealth</label><input data-f="netWorth" value="' + esc(p.netWorth) + '"></div>';

  h += '<div class="fld"><label>Faith orientation</label><input data-f="faithNote" value="' + esc(p.faithNote) + '"></div>';
  h += '<div class="grid2"><div class="fld"><label>You</label><input data-f="advisor" value="' + esc(p.advisor) + '"></div>' +

function stageSel(v, attrs){
  var h = '<select ' + attrs + '>';
  for (var i=0;i<STAGES.length;i++){ h += '<option value="' + i + '"' + (Number(v) === i ? ' selected' : '') + '>' + i + ' ' + STAGES[i] + '</option>'; }

}

function crumbText(){
  if (VIEW.tab === "role"){ return roleById(ROLE).name; }
  if (VIEW.tab === "matters"){ return VIEW.id ? matById(VIEW.id).name : "What matters"; }
  if (VIEW.tab === "profiles"){ return "Profiles &amp; assessments"; }
  if (VIEW.tab === "calendar"){ return "Master calendar"; }
  return "Family profile";
}
function render(){
  var h = "";
  if (VIEW.tab === "role"){ h = renderRole(); }
  else if (VIEW.tab === "matters"){ h = renderMatters(); }
  else if (VIEW.tab === "profiles"){ h = renderProfiles(); }
  else if (VIEW.tab === "calendar"){ h = renderCalendar(); }
  else { h = renderFamily(); }
  document.getElementById("app").innerHTML = h;
  document.getElementById("crumb").innerHTML = crumbText();
  var tb = document.getElementById("tabs").getElementsByTagName("button");
  for (var i=0;i<tb.length;i++){ tb[i].className = (tb[i].getAttribute("data-tab") === VIEW.tab) ? "on" : ""; }
  var sg = document.getElementById("langSeg").getElementsByTagName("button");
  for (var j=0;j<sg.length;j++){ sg[j].className = (sg[j].getAttribute("data-lang") === PROFILE.faithLanguage) ? "on" : ""; }
  window.scrollTo(0,0);
}

/* ---------- ics ---------- */
function pad(n){ return (n < 10 ? "0" : "") + n; }
function icsStamp(date, time, addMin){
  var p = date.split("-"), t = (time || "09:00").split(":");
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), Number(t[0]), Number(t[1]));
  if (addMin){ d = new Date(d.getTime() + addMin * 60000); }
  return d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + "T" + pad(d.getHours()) + pad(d.getMinutes()) + "00";
}
function downloadIcs(){
  var s = "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//CAN//Family Calendar//EN\r\n";
  for (var i=0;i<EVENTS.length;i++){
    var e = EVENTS[i];
    if (!e.date){ continue; }
    s += "BEGIN:VEVENT\r\nUID:can-" + i + "-" + e.date + "@can\r\n";
    s += "DTSTART:" + icsStamp(e.date, e.time, 0) + "\r\nDTEND:" + icsStamp(e.date, e.time, Number(e.mins) || 60) + "\r\n";
    s += "SUMMARY:" + e.title.replace(/[,;]/g," ") + "\r\n";
    s += "DESCRIPTION:" + (e.type + (e.who ? " with " + e.who : "") + (e.link ? " " + e.link : "")).replace(/[,;]/g," ") + "\r\n";
    if (e.link){ s += "LOCATION:" + e.link.replace(/[,;]/g," ") + "\r\n"; }
    s += "BEGIN:VALARM\r\nTRIGGER:-P3D\r\nACTION:DISPLAY\r\nDESCRIPTION:Reminder\r\nEND:VALARM\r\n";
    s += "END:VEVENT\r\n";
  }
  s += "END:VCALENDAR\r\n";
  var blob = new Blob([s], {type:"text/calendar"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = PROFILE.familyName + "-family-calendar.ics";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* ---------- generation ---------- */
function busy(msg){
  var z = document.getElementById("zone") || document.getElementById("app");
  if (z){ z.innerHTML = '<div class="wrap"><div class="spin">' + msg + '<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div></div>'; }
}
function fail(err){
  var z = document.getElementById("zone") || document.getElementById("app");
  if (z){ z.innerHTML = '<div class="wrap"><div class="err">Could not reach the generation service. ' + esc(String(err.message || err)) +
    '<br><br>This edition writes live, so it needs to run inside the Claude app.</div></div>'; }
}
async function run(action){
  var a = action.split(":");
  try {
    if (a[0] === "agenda"){
      busy("Building the " + roleById(ROLE).name + " working set");
      CACHE["agenda:" + ROLE] = await callClaude(promptRoleAgenda());
    } else if (a[0] === "matter"){
      var m = matById(a[1]);
      busy("Discerning " + m.name);
      CACHE["mat:" + a[1]] = await callClaude(promptMatter(m));
      VIEW = {tab:"matters", id:a[1]};
    } else if (a[0] === "room"){
      busy("Reading the room"); CACHE.room = await callClaude(promptReadTheRoom());
    } else if (a[0] === "ev"){
      var ev = EVENTS[Number(a[1])];
      busy("Writing the invitation, agenda, and reminders");
      CACHE["ev:" + a[1]] = await callClaude(promptComms(ev));
    }
    render();
  } catch (err){ fail(err); }
}

/* ---------- events ---------- */
document.addEventListener("click", function(evt){
  var el = evt.target.closest ? evt.target.closest("[data-tab],[data-lang],[data-go],[data-role],[data-matter],[data-gen],[data-copy],[data-addkid],[data-rmkid],[data-addcu],[data-rmcu],[data-addev],[data-rmev],[data-comms],[data-ics],[data-seed]") : null;
  if (!el){ return; }
  if (el.hasAttribute("data-tab")){ VIEW = {tab:el.getAttribute("data-tab"), id:null}; save(); render(); return; }
  if (el.hasAttribute("data-lang")){ PROFILE.faithLanguage = el.getAttribute("data-lang"); save(); render(); return; }
  if (el.hasAttribute("data-go")){ VIEW = {tab:el.getAttribute("data-go"), id:null}; save(); render(); return; }
  if (el.hasAttribute("data-role")){ ROLE = el.getAttribute("data-role"); save(); render(); return; }
  if (el.hasAttribute("data-matter")){ VIEW = {tab:"matters", id:el.getAttribute("data-matter")}; render(); return; }
  if (el.hasAttribute("data-gen")){ run(el.getAttribute("data-gen")); return; }
  if (el.hasAttribute("data-comms")){ run("ev:" + el.getAttribute("data-comms")); return; }
  if (el.hasAttribute("data-ics")){ downloadIcs(); return; }
  if (el.hasAttribute("data-seed")){
    var base = new Date(); base.setMonth(base.getMonth() + 1);
    for (var r=0;r<RHYTHM.length;r++){
      var d = new Date(base.getTime()); d.setMonth(d.getMonth() + r * 2);
      EVENTS.push({title:PROFILE.familyName + " " + RHYTHM[r][0], type:RHYTHM[r][1], mins:RHYTHM[r][2],
        date:d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()), time:"18:00", link:"", who:""});
    }
    save(); render(); return;
  }
  if (el.hasAttribute("data-addev")){
    if (!NEWEV.title){ return; }
    EVENTS.push({title:NEWEV.title, date:NEWEV.date, time:NEWEV.time, mins:NEWEV.mins, type:NEWEV.type, link:NEWEV.link, who:NEWEV.who});
    NEWEV = {title:"", date:"", time:"18:00", mins:90, type:"meeting", link:"", who:""};
    save(); render(); return;
  }
  if (el.hasAttribute("data-rmev")){ EVENTS.splice(Number(el.getAttribute("data-rmev")),1); save(); render(); return; }
  if (el.hasAttribute("data-addcu")){ CUSTOM.push({person:PERSON, name:"", result:""}); save(); render(); return; }
  if (el.hasAttribute("data-rmcu")){ CUSTOM.splice(Number(el.getAttribute("data-rmcu")),1); save(); render(); return; }
  if (el.hasAttribute("data-addkid")){ PROFILE.children.push({name:"New child", age:30, stage:0, note:""}); save(); render(); return; }
  if (el.hasAttribute("data-rmkid")){ PROFILE.children.splice(Number(el.getAttribute("data-rmkid")),1); save(); render(); return; }
  if (el.hasAttribute("data-copy")){
    var txt = CACHE[el.getAttribute("data-copy")] || "";
    if (navigator.clipboard){ navigator.clipboard.writeText(txt); }
    el.innerHTML = "Copied"; setTimeout(function(){ el.innerHTML = "Copy"; }, 1400); return;
  }
});

function apply(el){
  if (!el.hasAttribute){ return false; }
  if (el.hasAttribute("data-f")){ PROFILE[el.getAttribute("data-f")] = el.value; save(); return true; }
  if (el.hasAttribute("data-kid")){ PROFILE.children[Number(el.getAttribute("data-kid"))][el.getAttribute("data-k")] = el.value; save(); return true; }
  if (el.hasAttribute("data-as")){ ASSESS[el.getAttribute("data-as")] = el.value; save(); return true; }
  if (el.hasAttribute("data-ne")){ NEWEV[el.getAttribute("data-ne")] = el.value; return true; }
  if (el.hasAttribute("data-cu")){
    var p = el.getAttribute("data-cu").split(":");
    CUSTOM[Number(p[0])][p[1]] = el.value; save(); return true;
  }
  if (el.hasAttribute("data-sc")){
    var q = el.getAttribute("data-sc").split(":");
    if (!SCORES[q[0]]){ SCORES[q[0]] = {m:3, r:3}; }
    SCORES[q[0]][q[1]] = Number(el.value);
    var b = el.parentNode.getElementsByTagName("b")[0];
    if (b){ b.innerHTML = el.value; }
    var vd = el.parentNode.parentNode.getElementsByClassName("verdict")[0];
    if (vd){ var v = verdict(q[0]); vd.className = "verdict v-" + v.k; vd.innerHTML = v.t; }
    save(); return true;
  }
  return false;
}
document.addEventListener("input", function(evt){ apply(evt.target); });
document.addEventListener("change", function(evt){
  var el = evt.target;
  if (el.id === "perSel"){ PERSON = el.value; render(); return; }
  if (apply(el) && el.tagName === "SELECT" && !el.hasAttribute("data-ne")){ render(); }
});

(async function(){ await load(); render(); })();
</script>
