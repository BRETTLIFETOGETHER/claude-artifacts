<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The CAN Platform&trade;</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--navy:#0C1D33;--panel:#11253F;--line:rgba(201,169,78,.24);--hair:rgba(201,169,78,.14);
 --gold:#C9A94E;--gold-lt:#E6CE8C;--paper:#EFE9DC;--body:#D6DEE9;--muted:#90A4BD;--red:#D98A6A;--green:#8FBF9F}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--navy);background-image:radial-gradient(120% 50% at 50% 0%,#142A48 0%,#0C1D33 50%,#07121F 100%);
 background-attachment:fixed;color:var(--body);font-family:"Cormorant Garamond",Georgia,serif;font-size:18px;line-height:1.6}
.wrap{max-width:800px;margin:0 auto;padding:0 18px}
h1,h2,h3,h4,h5{font-family:"Playfair Display",Georgia,serif;font-weight:500;color:var(--paper);margin:0}
p{margin:0 0 .9em}
button{font:inherit;cursor:pointer}
a{color:var(--gold-lt)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.label{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
.top{position:sticky;top:0;z-index:20;background:rgba(9,22,38,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:800px;margin:0 auto;padding:.5rem 18px;display:flex;align-items:center;gap:.55rem}
.brand{font-family:"Playfair Display",serif;font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.crumb{flex:1;min-width:0;font-size:.76rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;border:1px solid var(--hair)}
.seg button{background:none;border:0;color:var(--muted);font-size:.52rem;letter-spacing:.1em;text-transform:uppercase;padding:.26rem .4rem}
.seg button.on{background:var(--gold);color:#0C1D33;font-weight:600}
.tabs{max-width:800px;margin:0 auto;padding:0 18px;display:flex;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
 font-family:"Playfair Display",serif;font-size:.83rem;padding:.45rem .6rem;white-space:nowrap}
.tabs button.on{color:var(--gold-lt);border-bottom-color:var(--gold)}
.tabs button i{font-style:normal;font-size:.55rem;color:var(--gold);margin-right:.22rem}
.subnav{display:flex;flex-wrap:wrap;gap:.35rem;margin:0 0 1rem}
.subnav button{background:none;border:1px solid var(--hair);color:var(--muted);font-size:.6rem;letter-spacing:.13em;text-transform:uppercase;padding:.32rem .55rem}
.subnav button.on{border-color:var(--gold);color:var(--gold-lt);background:rgba(201,169,78,.09)}
.sec{padding:22px 0}
.sechead{margin:0 0 .9rem}
.sechead h2{font-size:clamp(1.25rem,5.2vw,1.8rem);line-height:1.12}
.sechead .sub{color:var(--muted);font-style:italic;font-size:.95rem;margin:.3rem 0 0}
.eng{font-size:.56rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:.45rem}
.back{background:none;border:0;color:var(--gold);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;padding:.2rem 0;margin-bottom:.7rem}
.subhead{font-family:"Playfair Display",serif;color:var(--gold-lt);font-size:.96rem;margin:1.3rem 0 .35rem;border-bottom:1px solid var(--hair);padding-bottom:.22rem}
.band{display:flex;flex-wrap:wrap;gap:1px;background:var(--hair);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 0 1rem}
.band div{flex:1 1 33%;background:var(--navy);padding:.65rem .3rem;text-align:center}
.band b{display:block;font-family:"Playfair Display",serif;font-size:1.25rem;color:var(--gold-lt);font-weight:500;line-height:1}
.band span{display:block;font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:.3rem}
.row{display:flex;gap:.75rem;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--hair);padding:.75rem 0;color:inherit}
.row:hover .rt{color:var(--gold-lt)}
.rn{font-family:"Playfair Display",serif;color:var(--gold);font-size:.9rem;min-width:2.1em;line-height:1.5}
.rmain{flex:1;min-width:0}
.rt{display:block;font-family:"Playfair Display",serif;font-size:1rem;color:var(--paper);line-height:1.25}
.rs{display:block;font-size:.9rem;color:var(--muted);font-style:italic;margin-top:.14rem;line-height:1.4}
.rmeta{display:block;font-size:.53rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-top:.26rem}
.arw{color:var(--gold);padding-top:.15rem}
.tag{display:inline-block;font-size:.48rem;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--hair);color:var(--muted);padding:.06rem .26rem;margin-left:.3rem;vertical-align:middle}
.panel{border:1px solid var(--line);background:var(--panel);padding:.95rem 1rem;margin:0 0 .95rem}
.panel h4{font-size:1.02rem;color:var(--gold-lt);margin:0 0 .4rem}
.panel ul{margin:0;padding-left:1.05rem}
.panel li{margin:0 0 .22rem;font-size:.96rem}
.gate{border:1px solid var(--line);background:var(--panel);padding:.5rem .7rem;margin:0 0 .85rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.gate .gl{font-size:.53rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);flex:1}
.out{border:1px solid var(--hair);background:rgba(255,255,255,.02);padding:.95rem 1rem;margin:0 0 .95rem}
.out h4{font-family:"Playfair Display",serif;color:var(--gold-lt);font-size:1rem;margin:1rem 0 .35rem}
.out h4:first-child{margin-top:0}
.out h5{font-size:.86rem;color:var(--paper);margin:.75rem 0 .22rem;letter-spacing:.05em;text-transform:uppercase}
.out ul{margin:0 0 .75rem;padding-left:1.1rem}
.out li{margin:0 0 .24rem}
.out strong{color:var(--paper)}
.out blockquote{margin:0 0 .75rem;padding-left:.8rem;border-left:2px solid var(--gold);font-style:italic;color:var(--paper)}
.acts{display:flex;gap:.42rem;flex-wrap:wrap;margin:0 0 .85rem}
.act{background:none;border:1px solid var(--line);color:var(--gold);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;padding:.4rem .66rem}
.act.primary{background:var(--gold);color:#0C1D33;border-color:var(--gold);font-weight:600}
.spin{color:var(--muted);font-style:italic;padding:1.1rem 0;text-align:center}
.dot{display:inline-block;animation:bl 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
.err{border:1px solid var(--red);color:var(--red);padding:.65rem .8rem;margin:0 0 .85rem;font-size:.93rem}
.fld{margin:0 0 .75rem}
.fld label{display:block;font-size:.57rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:.25rem}
.fld input,.fld select,.fld textarea{width:100%;background:var(--panel);border:1px solid var(--hair);color:var(--paper);font-family:inherit;font-size:1rem;padding:.48rem .58rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.grid3{display:grid;grid-template-columns:1.4fr .6fr 1fr;gap:.42rem;align-items:end}
.kid{border-bottom:1px solid var(--hair);padding:.6rem 0}
.rm{background:none;border:0;color:var(--red);font-size:.56rem;letter-spacing:.12em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:.3rem;margin:0 0 .85rem}
.chip{border:1px solid var(--hair);color:var(--muted);font-size:.78rem;padding:.24rem .48rem;background:none}
.chip.on{border-color:var(--gold);color:var(--gold-lt);background:rgba(201,169,78,.09)}
.rel{border-top:1px solid var(--hair);margin:0 0 1rem}
.relrow{display:flex;align-items:center;gap:.65rem;padding:.5rem 0;border-bottom:1px solid var(--hair)}
.relname{flex:1;min-width:0;font-size:.96rem;color:var(--paper);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.relname i{color:var(--muted);font-style:normal;font-size:.8rem}
.pips{display:flex;gap:3px}
.pip{width:10px;height:10px;border:1px solid var(--hair)}
.pip.on{background:var(--gold);border-color:var(--gold)}
.relstage{font-size:.54rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);min-width:5.4em;text-align:right}
.pill{display:inline-block;font-size:.56rem;letter-spacing:.15em;text-transform:uppercase;padding:.18rem .45rem;border:1px solid currentColor}
.r-HIGH{color:var(--red)}.r-ELEVATED{color:var(--gold)}.r-MODERATE{color:var(--gold-lt)}.r-LOW{color:var(--green)}
.mrow{border-bottom:1px solid var(--hair);padding:.7rem 0}
.mtop{display:flex;gap:.55rem;align-items:baseline}
.mname{flex:1;font-family:"Playfair Display",serif;font-size:.98rem;color:var(--paper)}
.mq{font-size:.9rem;color:var(--muted);font-style:italic;margin:.08rem 0 .4rem}
.sl{display:flex;align-items:center;gap:.45rem;margin:.22rem 0}
.sl span{font-size:.54rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);min-width:4.4em}
.sl input{flex:1;accent-color:var(--gold)}
.sl b{font-family:"Playfair Display",serif;color:var(--gold-lt);min-width:1.2em;text-align:right;font-weight:500}
.verdict{display:inline-block;font-size:.54rem;letter-spacing:.14em;text-transform:uppercase;padding:.14rem .42rem;border:1px solid currentColor}
.v-act{color:var(--red)}.v-prep{color:var(--gold)}.v-watch{color:var(--muted)}.v-hold{color:var(--green)}
.ev{border-bottom:1px solid var(--hair);padding:.65rem 0;display:flex;gap:.7rem;align-items:flex-start}
.evd{font-family:"Playfair Display",serif;color:var(--gold);font-size:.78rem;min-width:5.2em;line-height:1.35}
.evm{flex:1;min-width:0}
.evt{font-family:"Playfair Display",serif;font-size:.98rem;color:var(--paper)}
.evs{display:block;font-size:.86rem;color:var(--muted);font-style:italic}
.loop{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:1rem 0;margin:1.2rem 0;text-align:center}
.loop span{font-family:"Playfair Display",serif;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--paper);white-space:nowrap}
.loop i{color:var(--gold);font-style:normal;padding:0 .35rem}
.foot{text-align:center;padding:28px 0 52px;border-top:1px solid var(--line);margin-top:18px}
.foot p{font-size:.57rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0}
@media (min-width:660px){body{font-size:19px}.band div{flex:1 1 16%}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</head>
<body>
<div class="top">
  <div class="topin">
    <span class="brand">CAN</span>
    <span class="crumb" id="crumb">Home</span>
    <span class="seg" id="langSeg">
      <button type="button" data-lang="faith-forward">Fwd</button>
      <button type="button" data-lang="faith-friendly">Frnd</button>
      <button type="button" data-lang="values-based">Val</button>
    </span>
  </div>
  <div class="tabs" id="tabs"></div>
</div>
<div id="app"></div>
<footer class="foot"><div class="wrap"><p>The CAN Platform &middot; AI recommends. The advisor approves.</p></div></footer>

<script>
var JOURNEYS = /*__JOURNEYS__*/;
var CATS = /*__CATS__*/;
var TOOLS125 = /*__TOOLS125__*/;
var GROUPS = /*__GROUPS__*/;
var TEMPLATES = /*__TEMPLATES__*/;
var INSTRUMENTS = /*__INSTRUMENTS__*/;
var ROLES = /*__ROLES__*/;
var ASSESSMENTS = /*__ASSESSMENTS__*/;
var MATTERS = /*__MATTERS__*/;
var RHYTHM = /*__RHYTHM__*/;
var CATLIST = /*__CATLIST__*/;
var ENGINES = /*__ENGINES__*/;
var STATS = /*__STATS__*/;

var STAGES = ["Unknown","Identified","Introduced","Connected","Engaged","Trusted"];
var SESSIONS = [
 {n:1,name:"Understand",q:"What is the issue, and why does it matter?",from:1,to:8},
 {n:2,name:"Reflect",q:"What do I personally believe, and what has shaped me?",from:9,to:15},
 {n:3,name:"Discuss",q:"What does my family believe, and where do we differ?",from:16,to:23},
 {n:4,name:"Decide",q:"What will we do, and what conversation comes next?",from:24,to:30}];
var CONCERNS = ["Entitlement","Communication","Inheritance readiness","Succession","Family conflict","Generosity","Business transition","Aging","Surviving spouse","Lack of purpose"];
var ASPIRATIONS = ["Unity","Impact","Generosity","Business continuity","Next-generation preparation","Faith transfer","Story preservation","Legacy"];
var TEAM = ["CPA","Estate attorney","Insurance advisor","Trustee","Family office","Pastor","Coach","Counselor","Philanthropy advisor","Business advisor"];

var PROFILE = {
 familyName:"Anderson", g1a:"John", g1aAge:67, g1aStage:5, g1b:"Susan", g1bAge:65, g1bStage:4,
 netWorth:"$22M estimated family net worth",
 business:"Family manufacturing business; eldest son expected to enter leadership",
 daf:true, faithNote:"Strong Christian faith orientation; long-time church members",
 faithLanguage:"faith-forward", tone:"reflective",
 children:[{name:"Michael",age:38,stage:3,note:"Expected business successor"},
           {name:"Lauren",age:35,stage:1,note:"Disconnected from family financial discussions"},
           {name:"David",age:31,stage:2,note:"Spouse cautious about inherited wealth"}],
 grandkids:4, g3Stage:0,
 concerns:["Entitlement","Inheritance readiness","Succession","Communication"],
 aspirations:["Unity","Next-generation preparation","Faith transfer","Generosity"],
 team:["CPA","Estate attorney","Pastor"],
 journeys:0, assessments:1, lastMeetingYears:3, stories:0,
 advisor:"Dana Whitfield", advisorAge:63, firm:"Smith Wealth Partners",
 secondaryAdvisor:false, successionComplete:false };

var ROLE = "r1", SCORES = {}, ASSESS = {}, CUSTOM = [], EVENTS = [], NOTES = {};
var CACHE = {}, DAYLIST = {};
var VIEW = {tab:"home", sub:"", id:null, ses:0, day:0};
var TB = {tid:"x1", who:"", length:"standard"};
var IV = {iid:null, who:""};
var PERSON = "";
var NEWEV = {title:"", date:"", time:"18:00", mins:90, type:"meeting", link:"", who:""};

function byId(id){ for (var i=0;i<JOURNEYS.length;i++){ if (JOURNEYS[i].id === id){ return JOURNEYS[i]; } } return null; }
function toolById(id){ for (var i=0;i<TOOLS125.length;i++){ if (TOOLS125[i].id === id){ return TOOLS125[i]; } } return null; }
function catByK(k){ for (var i=0;i<CATS.length;i++){ if (CATS[i].k === k){ return CATS[i]; } } return null; }
function grpByK(k){ for (var i=0;i<GROUPS.length;i++){ if (GROUPS[i].k === k){ return GROUPS[i]; } } return null; }
function tplById(id){ for (var i=0;i<TEMPLATES.length;i++){ if (TEMPLATES[i].id === id){ return TEMPLATES[i]; } } return null; }
function ivById(id){ for (var i=0;i<INSTRUMENTS.length;i++){ if (INSTRUMENTS[i].id === id){ return INSTRUMENTS[i]; } } return null; }
function roleById(id){ for (var i=0;i<ROLES.length;i++){ if (ROLES[i].id === id){ return ROLES[i]; } } return ROLES[0]; }
function matById(id){ for (var i=0;i<MATTERS.length;i++){ if (MATTERS[i].id === id){ return MATTERS[i]; } } return null; }

function people(){
  var p = PROFILE, out = [p.g1a, p.g1b];
  for (var i=0;i<p.children.length;i++){ out.push(p.children[i].name); }
  if (Number(p.grandkids) > 0){ out.push("Grandchildren"); }
  out.push(p.advisor + " (professional)");
  return out;
}
function ivSubjects(ins){
  var p = PROFILE, out = [], i;
  if (ins.aud === "couple"){ out.push(p.g1a + " and " + p.g1b); }
  else if (ins.aud === "g1both"){ out.push(p.g1a); out.push(p.g1b); }
  else if (ins.aud === "children"){ for (i=0;i<p.children.length;i++){ out.push(p.children[i].name); } }
  else if (ins.aud === "childrenGroup"){
    var n = []; for (i=0;i<p.children.length;i++){ n.push(p.children[i].name); }
    out.push(n.join(", ") + " together");
  } else if (ins.aud === "g3"){ out.push("The " + p.grandkids + " grandchildren"); }
  else if (ins.aud === "inlaws"){ for (i=0;i<p.children.length;i++){ out.push("Spouse of " + p.children[i].name); } }
  else { out.push("The whole " + p.familyName + " family"); }
  if (!out.length){ out.push("The " + p.familyName + " family"); }
  return out;
}
function score(id){ return SCORES[id] || {m:3, r:3}; }
function verdict(id){
  var s = score(id), gap = Number(s.m) - Number(s.r);
  if (gap >= 2){ return {k:"act", t:"Act now"}; }
  if (gap === 1){ return {k:"prep", t:"Prepare"}; }
  if (gap === 0){ return {k:"watch", t:"Watch"}; }
  return {k:"hold", t:"Maintain"};
}
function rankedMatters(){
  var a = MATTERS.slice();
  a.sort(function(x,y){
    var sx = score(x.id), sy = score(y.id);
    return ((Number(sy.m)-Number(sy.r))*10 + Number(sy.m)) - ((Number(sx.m)-Number(sx.r))*10 + Number(sx.m));
  });
  return a;
}
function computeMetrics(){
  var g2 = PROFILE.children.map(function(c){ return Number(c.stage); });
  var st = [Number(PROFILE.g1aStage), Number(PROFILE.g1bStage)].concat(g2);
  if (Number(PROFILE.grandkids) > 0){ st.push(Number(PROFILE.g3Stage)); }
  var sum = 0; for (var i=0;i<st.length;i++){ sum += st[i]; }
  var depth = st.length ? Math.round((sum/(st.length*5))*100) : 0;
  var known = g2.filter(function(s){ return s >= 3; }).length;
  var g2cov = g2.length ? Math.round((known/g2.length)*100) : 0;
  var g3cov = Number(PROFILE.grandkids) > 0 ? (Number(PROFILE.g3Stage) >= 3 ? 100 : 0) : 0;
  var d = [], pts = 0;
  if (Number(PROFILE.g1aAge) >= 65){ pts++; d.push("Primary client is " + PROFILE.g1aAge); }
  if (Number(PROFILE.advisorAge) >= 60){ pts++; d.push("Lead advisor is " + PROFILE.advisorAge + " with no stated succession"); }
  if (!PROFILE.secondaryAdvisor){ pts++; d.push("No secondary advisor relationship in the household"); }
  if (g2cov < 50){ pts += 2; d.push("Only " + known + " of " + g2.length + " adult children at connected or better"); }
  if (Number(PROFILE.g1bStage) < 3){ pts++; d.push("Spouse relationship is below connected"); }
  if (Number(PROFILE.lastMeetingYears) >= 2){ pts++; d.push("No family meeting in " + PROFILE.lastMeetingYears + " years"); }
  if (!PROFILE.successionComplete){ pts++; d.push("Succession discussion incomplete"); }
  if (Number(PROFILE.grandkids) > 0 && Number(PROFILE.g3Stage) < 2){ pts++; d.push("No G3 engagement"); }
  var risk = pts >= 6 ? "HIGH" : (pts >= 4 ? "ELEVATED" : (pts >= 2 ? "MODERATE" : "LOW"));
  return {depth:depth, g2cov:g2cov, g3cov:g3cov, known:known, total:g2.length, risk:risk, drivers:d};
}

/* ================= prompts ================= */
function langRule(){
  if (PROFILE.faithLanguage === "faith-forward"){ return "FAITH LANGUAGE: Faith-forward. Explicit Christian framing is welcome, and at most one short NIV verse where it genuinely fits."; }
  if (PROFILE.faithLanguage === "faith-friendly"){ return "FAITH LANGUAGE: Faith-friendly. Acknowledge that faith and values shape decisions, but quote no Scripture."; }
  return "FAITH LANGUAGE: Values-based. Use no religious language. Speak in values, purpose, character, and responsibility.";
}
function profileText(){
  var p = PROFILE, s = "FAMILY PROFILE\nFamily: The " + p.familyName + " family\n";
  s += "Generation 1: " + p.g1a + " (" + p.g1aAge + ", " + STAGES[p.g1aStage] + ") and " + p.g1b + " (" + p.g1bAge + ", " + STAGES[p.g1bStage] + ")\nAdult children:\n";
  for (var i=0;i<p.children.length;i++){
    var c = p.children[i];
    s += "  - " + c.name + ", " + c.age + ", " + STAGES[c.stage] + (c.note ? ". " + c.note : "") + "\n";
  }
  s += "Grandchildren: " + p.grandkids + (Number(p.grandkids)>0 ? " (" + STAGES[p.g3Stage] + ")" : "") + "\n";
  s += "Wealth: " + p.netWorth + "\nBusiness: " + (p.business || "None stated") + "\n";
  s += "Charitable vehicle: " + (p.daf ? "Donor-advised fund in place" : "None stated") + "\nFaith: " + (p.faithNote || "Not stated") + "\n";
  s += "Stated concerns: " + p.concerns.join(", ") + "\nStated aspirations: " + p.aspirations.join(", ") + "\n";
  s += "Professional team: " + p.team.join(", ") + "\n";
  s += "History: " + p.journeys + " journeys, " + p.assessments + " assessments, last family meeting " + p.lastMeetingYears + " years ago, " + p.stories + " stories captured\n";
  s += "Advisor: " + p.advisor + " (" + p.advisorAge + "), " + p.firm + ". Secondary advisor: " + (p.secondaryAdvisor ? "yes" : "none") + ". Succession discussion: " + (p.successionComplete ? "complete" : "incomplete") + "\n";
  return s;
}
function metricsText(){
  var m = computeMetrics();
  return "\nCOMPUTED METRICS (system-calculated, use these exact figures)\nRelationship Depth Score: " + m.depth +
    " of 100\nNext-Generation Coverage: " + m.g2cov + "% (" + m.known + " of " + m.total + ")\nG3 coverage: " + m.g3cov +
    "%\nRisk classification: " + m.risk + "\nRisk drivers: " + m.drivers.join("; ") + "\n";
}
function roleText(){
  var r = roleById(ROLE);
  return "\nWHO IS USING THIS: " + r.name + ". Accountable for: " + r.promise + " Recurring themes: " + r.themes.join("; ") +
    ".\nWrite from this professional's seat. Stay in their lane, and name the other professional when a question belongs to someone else.\n";
}

/* ================= api + md ================= */
async function callClaude(prompt){
  var res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({model:"claude-sonnet-4-6", max_tokens:1000, messages:[{role:"user", content:prompt}]})
  });
  if (!res.ok){ throw new Error("Request failed (" + res.status + ")"); }
  var d = await res.json(), out = "";
  for (var i=0;i<d.content.length;i++){ if (d.content[i].type === "text"){ out += d.content[i].text; } }
  return out.trim();
}
function parsePipes(t){
  var rows = [], lines = t.split("\n");
  for (var i=0;i<lines.length;i++){
    var p = lines[i].split("|");
    if (p.length >= 3){ rows.push({k:p[0].replace(/[^0-9]/g,""), t:p[1].trim(), d:p.slice(2).join("|").trim()}); }
  }
  return rows;
}
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function inline(t){
  t = t.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  return t.replace(/(^|[^*])\*([^*]+)\*/g,"$1<em>$2</em>");
}
function mdToHtml(src){
  var lines = esc(src).split("\n"), html = "", inL = false;
  for (var i=0;i<lines.length;i++){
    var t = lines[i].replace(/^\s+|\s+$/g,"");
    if (t === ""){ if (inL){ html += "</ul>"; inL = false; } continue; }
    if (t.indexOf("### ") === 0){ if (inL){ html += "</ul>"; inL=false; } html += "<h5>" + inline(t.slice(4)) + "</h5>"; continue; }
    if (t.indexOf("## ") === 0){ if (inL){ html += "</ul>"; inL=false; } html += "<h4>" + inline(t.slice(3)) + "</h4>"; continue; }
    if (t.indexOf("&gt; ") === 0){ if (inL){ html += "</ul>"; inL=false; } html += "<blockquote>" + inline(t.slice(5)) + "</blockquote>"; continue; }
    if (t.indexOf("- ") === 0 || t.indexOf("* ") === 0){ if (!inL){ html += "<ul>"; inL=true; } html += "<li>" + inline(t.slice(2)) + "</li>"; continue; }
    var n = t.match(/^(\d+)\.\s+(.*)$/);
    if (n){ if (!inL){ html += "<ul>"; inL=true; } html += "<li><strong>" + n[1] + ".</strong> " + inline(n[2]) + "</li>"; continue; }
    if (inL){ html += "</ul>"; inL = false; }
    html += "<p>" + inline(t) + "</p>";
  }
  if (inL){ html += "</ul>"; }
  return html;
}
function norm(s){ return String(s).toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").replace(/^\s+|\s+$/g,""); }
function findJourney(title){
  var t = norm(title), i;
  for (i=0;i<JOURNEYS.length;i++){ if (norm(JOURNEYS[i].t) === t){ return JOURNEYS[i]; } }
  for (i=0;i<JOURNEYS.length;i++){ if (t.indexOf(norm(JOURNEYS[i].t)) > -1 || norm(JOURNEYS[i].t).indexOf(t) > -1){ return JOURNEYS[i]; } }
  return null;
}
function genBlock(key, lbl, action){
  if (CACHE[key]){
    return '<div class="acts"><button class="act" data-gen="' + action + '" type="button">Regenerate</button>' +
      '<button class="act" data-copy="' + key + '" type="button">Copy</button></div><div class="out">' + mdToHtml(CACHE[key]) + '</div>';
  }
  return '<div class="acts"><button class="act primary" data-gen="' + action + '" type="button">' + lbl + '</button></div>';
}

async function save(){

    if (typeof window.storage !== "undefined" && window.storage){
      await window.storage.set("can:profile", JSON.stringify(PROFILE));

    }

}
async function load(){
  try {
    if (typeof window.storage !== "undefined" && window.storage){
      var a = await window.storage.get("can:profile");
      if (a && a.value){ var p = JSON.parse(a.value); for (var k in p){ if (Object.prototype.hasOwnProperty.call(p,k)){ PROFILE[k] = p[k]; } } }
    }
  } catch (e){}

    if (typeof window.storage !== "undefined" && window.storage){
      var b = await window.storage.get("can:platform");
      if (b && b.value){ var s = JSON.parse(b.value);
        ROLE = s.role || ROLE; SCORES = s.scores || {}; ASSESS = s.assess || {}; CUSTOM = s.custom || []; EVENTS = s.events || []; }
    }
  } catch (e){}
}

      }
    }
  } else {
    for (var gi=0;gi<GROUPS.length;gi++){
      var gr = GROUPS[gi];
      h += '<button class="row" type="button" data-grp="' + gr.k + '">' +
        '<span class="rn">' + gr.user.slice(0,1) + '</span><span class="rmain"><span class="rt">' + gr.name + '</span>' +
        '<span class="rs">' + gr.promise + '</span><span class="rmeta">' + gr.count + ' tools</span></span><span class="arw">&rsaquo;</span></button>';
    }
  }
  return h + '</div></div>';
}

/* ================= render ================= */
function crumbText(){
  var e = null;
  for (var i=0;i<ENGINES.length;i++){ if (ENGINES[i].k === VIEW.tab){ e = ENGINES[i]; } }
  var base = e ? (e.k === "home" ? "The " + PROFILE.familyName + " family" : "Engine " + e.n + " &middot; " + e.name) : "CAN";
  if (VIEW.tab === "experience" && VIEW.id){ base += " &middot; " + byId(VIEW.id).t; }
  return base;
}
function render(){
  var h = "";
  if (VIEW.tab === "home"){ h = renderHome(); }
  else if (VIEW.tab === "know"){ h = renderKnow(); }
  else if (VIEW.tab === "prescribe"){ h = renderPrescribe(); }
  else if (VIEW.tab === "personalize"){ h = renderPersonalize(); }
  else if (VIEW.tab === "prepare"){ h = renderPrepare(); }
  else if (VIEW.tab === "experience"){ h = renderExperience(); }
  else if (VIEW.tab === "measure"){ h = renderMeasure(); }
  else { h = renderFirm(); }
  document.getElementById("app").innerHTML = h;
  document.getElementById("crumb").innerHTML = crumbText();
  var tb = document.getElementById("tabs").getElementsByTagName("button");
  for (var i=0;i<tb.length;i++){ tb[i].className = (tb[i].getAttribute("data-tab") === VIEW.tab) ? "on" : ""; }
  var sg = document.getElementById("langSeg").getElementsByTagName("button");
  for (var j=0;j<sg.length;j++){ sg[j].className = (sg[j].getAttribute("data-lang") === PROFILE.faithLanguage) ? "on" : ""; }
  window.scrollTo(0,0);
}
function buildTabs(){
  var h = "";
  for (var i=0;i<ENGINES.length;i++){
    var e = ENGINES[i];
    h += '<button type="button" data-tab="' + e.k + '">' + (e.k === "home" ? "" : '<i>' + e.n + '</i>') + e.tab + '</button>';
  }
  document.getElementById("tabs").innerHTML = h;
}

/* ================= ics ================= */
function pad(n){ return (n < 10 ? "0" : "") + n; }
function icsStamp(date, time, add){
  var p = date.split("-"), t = (time || "09:00").split(":");
  var d = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]), Number(t[0]), Number(t[1]));
  if (add){ d = new Date(d.getTime() + add*60000); }
  return d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + "T" + pad(d.getHours()) + pad(d.getMinutes()) + "00";
}
function downloadIcs(){
  var s = "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//CAN//Family Calendar//EN\r\n";
  for (var i=0;i<EVENTS.length;i++){
    var e = EVENTS[i];
    if (!e.date){ continue; }
    s += "BEGIN:VEVENT\r\nUID:can-" + i + "-" + e.date + "@can\r\nDTSTART:" + icsStamp(e.date,e.time,0) +
      "\r\nDTEND:" + icsStamp(e.date,e.time,Number(e.mins)||60) + "\r\nSUMMARY:" + e.title.replace(/[,;]/g," ") + "\r\n";
    s += "DESCRIPTION:" + (e.type + (e.who ? " with " + e.who : "") + (e.link ? " " + e.link : "")).replace(/[,;]/g," ") + "\r\n";
    if (e.link){ s += "LOCATION:" + e.link.replace(/[,;]/g," ") + "\r\n"; }
    s += "BEGIN:VALARM\r\nTRIGGER:-P3D\r\nACTION:DISPLAY\r\nDESCRIPTION:Reminder\r\nEND:VALARM\r\nEND:VEVENT\r\n";
  }
  s += "END:VCALENDAR\r\n";
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([s], {type:"text/calendar"}));
  a.download = PROFILE.familyName + "-family-calendar.ics";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* ================= generation ================= */
function busy(msg){
  var z = document.getElementById("zone") || document.getElementById("app");
  if (z){ z.innerHTML = '<div class="spin">' + msg + '<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>'; }
}
function fail(err){
  var z = document.getElementById("zone") || document.getElementById("app");
  if (z){ z.innerHTML = '<div class="err">Could not reach the generation service. ' + esc(String(err.message || err)) +
    '<br><br>The platform writes live, so it needs to run inside the Claude app.</div>'; }
}
async function run(action){
  var a = action.split(":"), i;
  try {
    if (a[0] === "disc"){ busy("Building the discovery brief"); CACHE.disc = await callClaude(P_discovery()); }
    else if (a[0] === "prio"){ busy("Building the priority map"); CACHE.prio = await callClaude(P_priority()); }
    else if (a[0] === "presc"){
      busy("Reading the profile against all " + STATS.journeys + " journeys");
      var rows = parsePipes(await callClaude(P_prescribe()));
      if (!rows.length){ throw new Error("Unexpected format; try again."); }
      CACHE.presc = rows.slice(0,3);
    }
    else if (a[0] === "nba"){ busy("Naming the next action"); CACHE.nba = await callClaude(P_nba()); }
    else if (a[0] === "matter"){ var m = matById(a[1]); busy("Discerning " + m.name); CACHE["mat:" + a[1]] = await callClaude(P_matter(m)); VIEW.id = a[1]; }
    else if (a[0] === "tpl"){ var t = tplById(TB.tid); busy("Building " + t.name + " for " + TB.who); CACHE["X:" + TB.tid + ":" + TB.who + ":" + TB.length] = await callClaude(P_template(t)); }
    else if (a[0] === "agenda"){ busy("Building the " + roleById(ROLE).name + " working set"); CACHE["agenda:" + ROLE] = await callClaude(P_roleAgenda()); }
    else if (a[0] === "brief"){ busy("Building the meeting brief"); CACHE.brief = await callClaude(P_brief()); }
    else if (a[0] === "follow"){ busy("Drafting the follow-up"); CACHE.follow = await callClaude(P_followup()); }
    else if (a[0] === "room"){ busy("Reading the room"); CACHE.room = await callClaude(P_room()); }
    else if (a[0] === "depth"){ busy("Interpreting the metrics"); CACHE.depth = await callClaude(P_depth()); }
    else if (a[0] === "firm"){ busy("Writing the CEO note"); CACHE.firm = await callClaude(P_firm()); }
    else if (a[0] === "iq"){ busy("Writing the ten questions for " + IV.who); CACHE["Q:" + IV.iid + ":" + IV.who] = await callClaude(P_interview(ivById(IV.iid))); }
    else if (a[0] === "isum"){
      var nk = IV.iid + ":" + IV.who, notes = NOTES[nk] || "";
      if (notes.replace(/\s/g,"").length < 20){ throw new Error("Add a few notes from the conversation first."); }
      busy("Building the private summary");
      CACHE["M:" + IV.iid + ":" + IV.who] = await callClaude(P_ivSummary(ivById(IV.iid), notes));
    }
    else if (a[0] === "sess"){
      var e = byId(VIEW.id); busy("Opening the four sessions of " + e.t);
      var sr = parsePipes(await callClaude(P_sessions(e)));
      if (sr.length < 4){ throw new Error("Unexpected format; try again."); }
      CACHE["S:" + VIEW.id] = sr.slice(0,4);
    }
    else if (a[0] === "days"){
      var e2 = byId(VIEW.id), ses = SESSIONS[VIEW.ses-1];
      busy("Writing days " + ses.from + " to " + ses.to);
      var dr = parsePipes(await callClaude(P_days(e2, ses)));
      if (!dr.length){ throw new Error("Unexpected format; try again."); }
      DAYLIST["D:" + VIEW.id + ":" + VIEW.ses] = dr;
    }
    else if (a[0] === "day"){
      var e3 = byId(VIEW.id), ses3 = SESSIONS[VIEW.ses-1], days = DAYLIST["D:" + VIEW.id + ":" + VIEW.ses] || [], title = "Day " + VIEW.day;
      for (i=0;i<days.length;i++){ if (days[i].k === String(VIEW.day)){ title = days[i].t; } }
      busy("Writing day " + VIEW.day);
      CACHE["Y:" + VIEW.id + ":" + VIEW.day] = await callClaude(P_day(e3, ses3, VIEW.day, title));
    }
    else if (a[0] === "ev"){ busy("Writing the invitation, agenda, and reminders"); CACHE["ev:" + a[1]] = await callClaude(P_comms(EVENTS[Number(a[1])])); }
    render();
  } catch (err){ fail(err); }
}

/* ================= events ================= */
document.addEventListener("click", function(evt){
  var el = evt.target.closest ? evt.target.closest("[data-tab],[data-lang],[data-sub],[data-gen],[data-copy],[data-chip],[data-addkid],[data-rmkid],[data-addcu],[data-rmcu],[data-iv],[data-ivback],[data-matter],[data-matback],[data-cat],[data-entry],[data-ses],[data-day],[data-expback],[data-grp],[data-tool],[data-firmback],[data-seed],[data-addev],[data-rmev],[data-comms],[data-ics]") : null;
  if (!el){ return; }
  if (el.hasAttribute("data-tab")){ VIEW = {tab:el.getAttribute("data-tab"), sub:"", id:null, ses:0, day:0}; IV.iid = null; save(); render(); return; }
  if (el.hasAttribute("data-lang")){ PROFILE.faithLanguage = el.getAttribute("data-lang"); save(); render(); return; }
  if (el.hasAttribute("data-sub")){ VIEW.sub = el.getAttribute("data-sub"); VIEW.id = null; VIEW.ses = 0; VIEW.day = 0; VIEW.cat = null; VIEW.grp = null; IV.iid = null; render(); return; }
  if (el.hasAttribute("data-iv")){ IV.iid = el.getAttribute("data-iv"); IV.who = ""; render(); return; }
  if (el.hasAttribute("data-ivback")){ IV.iid = null; render(); return; }
  if (el.hasAttribute("data-matter")){ VIEW.id = el.getAttribute("data-matter"); VIEW.sub = "matters"; render(); return; }
  if (el.hasAttribute("data-matback")){ VIEW.id = null; render(); return; }
  if (el.hasAttribute("data-cat")){ VIEW.cat = el.getAttribute("data-cat"); VIEW.id = null; VIEW.ses = 0; VIEW.day = 0; render(); return; }
  if (el.hasAttribute("data-entry")){ VIEW = {tab:"experience", sub:"journeys", id:el.getAttribute("data-entry"), ses:0, day:0, cat:VIEW.cat}; render(); return; }
  if (el.hasAttribute("data-ses")){ VIEW.ses = Number(el.getAttribute("data-ses")); VIEW.day = 0; render(); return; }
  if (el.hasAttribute("data-day")){ VIEW.day = Number(el.getAttribute("data-day")); render(); return; }
  if (el.hasAttribute("data-expback")){
    var w = el.getAttribute("data-expback");
    if (w === "day"){ VIEW.day = 0; } else if (w === "ses"){ VIEW.ses = 0; } else if (w === "entry"){ VIEW.id = null; } else { VIEW.cat = null; }
    render(); return;
  }
  if (el.hasAttribute("data-grp")){ VIEW.grp = el.getAttribute("data-grp"); VIEW.id = null; render(); return; }
  if (el.hasAttribute("data-tool")){ VIEW.id = el.getAttribute("data-tool"); render(); return; }
  if (el.hasAttribute("data-firmback")){ if (VIEW.id){ VIEW.id = null; } else { VIEW.grp = null; } render(); return; }
  if (el.hasAttribute("data-gen")){ run(el.getAttribute("data-gen")); return; }
  if (el.hasAttribute("data-comms")){ run("ev:" + el.getAttribute("data-comms")); return; }
  if (el.hasAttribute("data-ics")){ downloadIcs(); return; }
  if (el.hasAttribute("data-seed")){
    var base = new Date(); base.setMonth(base.getMonth() + 1);
    for (var r=0;r<RHYTHM.length;r++){
      var d = new Date(base.getTime()); d.setMonth(d.getMonth() + r*2);
      EVENTS.push({title:PROFILE.familyName + " " + RHYTHM[r][0], type:RHYTHM[r][1], mins:RHYTHM[r][2],
        date:d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()), time:"18:00", link:"", who:""});
    }
    save(); render(); return;
  }
  if (el.hasAttribute("data-addev")){
    if (!NEWEV.title){ return; }
    EVENTS.push({title:NEWEV.title, date:NEWEV.date, time:NEWEV.time, mins:NEWEV.mins, type:NEWEV.type, link:NEWEV.link, who:NEWEV.who});
    NEWEV = {title:"", date:"", time:"18:00", mins:90, type:"meeting", link:"", who:""};
    save(); render(); return;
  }
  if (el.hasAttribute("data-rmev")){ EVENTS.splice(Number(el.getAttribute("data-rmev")),1); save(); render(); return; }
  if (el.hasAttribute("data-chip")){
    var grp = el.getAttribute("data-chip"), val = el.getAttribute("data-val"), arr = PROFILE[grp], ix = arr.indexOf(val);
    if (ix > -1){ arr.splice(ix,1); } else { arr.push(val); }
    save(); render(); return;
  }
  if (el.hasAttribute("data-addkid")){ PROFILE.children.push({name:"New child", age:30, stage:0, note:""}); save(); render(); return; }
  if (el.hasAttribute("data-rmkid")){ PROFILE.children.splice(Number(el.getAttribute("data-rmkid")),1); save(); render(); return; }
  if (el.hasAttribute("data-addcu")){ CUSTOM.push({person:PERSON, name:"", result:""}); save(); render(); return; }
  if (el.hasAttribute("data-rmcu")){ CUSTOM.splice(Number(el.getAttribute("data-rmcu")),1); save(); render(); return; }
  if (el.hasAttribute("data-copy")){
    var txt = CACHE[el.getAttribute("data-copy")] || "";
    if (navigator.clipboard){ navigator.clipboard.writeText(txt); }
    el.innerHTML = "Copied"; setTimeout(function(){ el.innerHTML = "Copy"; }, 1400); return;
  }
});
function apply(el){
  if (!el.hasAttribute){ return false; }
  if (el.hasAttribute("data-notes")){ NOTES[el.getAttribute("data-notes")] = el.value; return true; }
  if (el.hasAttribute("data-f")){
    var f = el.getAttribute("data-f"), v = el.value;
    PROFILE[f] = (f === "daf" || f === "secondaryAdvisor" || f === "successionComplete") ? (v === "yes") : v;
    save(); return true;
  }
  if (el.hasAttribute("data-kid")){ PROFILE.children[Number(el.getAttribute("data-kid"))][el.getAttribute("data-k")] = el.value; save(); return true; }
  if (el.hasAttribute("data-as")){ ASSESS[el.getAttribute("data-as")] = el.value; save(); return true; }
  if (el.hasAttribute("data-ne")){ NEWEV[el.getAttribute("data-ne")] = el.value; return true; }
  if (el.hasAttribute("data-cu")){ var p = el.getAttribute("data-cu").split(":"); CUSTOM[Number(p[0])][p[1]] = el.value; save(); return true; }
  if (el.hasAttribute("data-sc")){
    var q = el.getAttribute("data-sc").split(":");
    if (!SCORES[q[0]]){ SCORES[q[0]] = {m:3, r:3}; }
    SCORES[q[0]][q[1]] = Number(el.value);
    var b = el.parentNode.getElementsByTagName("b")[0];
    if (b){ b.innerHTML = el.value; }
    var vd = el.parentNode.parentNode.getElementsByClassName("verdict")[0];
    if (vd){ var v = verdict(q[0]); vd.className = "verdict v-" + v.k; vd.innerHTML = v.t; }
    save(); return true;
  }
  return false;
}
document.addEventListener("input", function(evt){ apply(evt.target); });
document.addEventListener("change", function(evt){
  var el = evt.target;
  if (el.id === "roleSel"){ ROLE = el.value; save(); render(); return; }
  if (el.id === "tplSel"){ TB.tid = el.value; TB.who = ""; render(); return; }
  if (el.id === "whoSel"){ TB.who = el.value; render(); return; }
  if (el.id === "lenSel"){ TB.length = el.value; render(); return; }
  if (el.id === "perSel"){ PERSON = el.value; render(); return; }
  if (el.id === "ivWho"){ IV.who = el.value; render(); return; }
  if (apply(el) && el.tagName === "SELECT" && !el.hasAttribute("data-ne")){ render(); }
});

(async function(){ buildTabs(); await load(); render(); })();
</script>
